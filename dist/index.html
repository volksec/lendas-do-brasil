<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Lendas do Brasil: Jornada Encantada — RPG idle de aventura inspirado livremente no folclore brasileiro.">
<meta name="theme-color" content="#0d0b14">
<title>Lendas do Brasil: Jornada Encantada</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d0b14'/><path d='M8 2 L13 8 L8 14 L3 8 Z' fill='%232ec98f' stroke='%23ffd94a'/></svg>">

<style>
/* =============================================================
 * styles.css — interface retrô de RPG com usabilidade moderna.
 * Paleta: madeira escura + dourado + acentos das regiões.
 * ============================================================= */
:root {
  --bg: #0d0b14;
  --panel: #1a1626;
  --panel2: #241d33;
  --line: #4a3f66;
  --gold: #ffd94a;
  --gold-dark: #a8802a;
  --text: #f0e9dc;
  --dim: #a89ec0;
  --ok: #4fd07a;
  --warn: #ff8a5a;
  --danger: #ff5f7e;
  --blue: #5aa9ff;
  --purple: #c07bff;
  --green: #5fd08a;
  --radius: 6px;
  --font: "Courier New", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body.high-contrast {
  --panel: #000000; --panel2: #14141c; --text: #ffffff; --dim: #d8d8e8; --line: #8a7fb0;
}
body.reduced-motion * { animation: none !important; transition: none !important; }

canvas.pix, #battle-canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

#app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
  background: linear-gradient(180deg, #120f1c, #0a0810);
}

/* ------------------- topbar ------------------- */
.topbar {
  display: flex; align-items: center; gap: .6rem;
  padding: .35rem .6rem;
  background: linear-gradient(180deg, #241d33, #17121f);
  border-bottom: 2px solid var(--gold-dark);
  flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; line-height: 1; margin-right: auto; }
.brand .b1 { color: var(--gold); font-weight: bold; font-size: .82rem; letter-spacing: .5px; text-shadow: 1px 1px 0 #000; }
.brand .b2 { color: var(--green); font-size: .6rem; }
.resources { display: flex; gap: .4rem; flex-wrap: wrap; }
.res {
  display: flex; align-items: center; gap: .25rem;
  background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius);
  padding: .15rem .4rem; font-size: .72rem;
}
.res .val { min-width: 2.2rem; text-align: right; }
.ico { display: inline-flex; line-height: 0; }
.ico canvas { image-rendering: pixelated; }
.tools { display: flex; gap: .25rem; }
.tbtn {
  background: #0f0c18; color: var(--text); border: 1px solid var(--line);
  border-radius: var(--radius); padding: .2rem .45rem; cursor: pointer; font-size: .8rem;
}
.tbtn:hover { border-color: var(--gold); }

/* ------------------- navbar ------------------- */
.navbar {
  display: flex; gap: .2rem; padding: .25rem .3rem;
  background: linear-gradient(0deg, #241d33, #17121f);
  border-top: 2px solid var(--gold-dark);
  overflow-x: auto; scrollbar-width: thin;
}
.nav {
  flex: 1 0 auto; min-width: 52px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius);
  color: var(--dim); cursor: pointer; padding: .25rem .3rem; font-family: var(--font);
}
.nav .nic { font-size: .95rem; }
.nav .nlb { font-size: .55rem; white-space: nowrap; }
.nav:hover { color: var(--text); border-color: var(--line); }
.nav.on { color: var(--gold); border-color: var(--gold-dark); background: #0f0c18; }

/* ------------------- telas ------------------- */
.screen { overflow-y: auto; overflow-x: hidden; padding: 0; position: relative; }
.screen > h2.title, .screen > h3.title { margin: .6rem .7rem .2rem; color: var(--gold); font-size: .95rem; }
.sub { margin: 0 .7rem .5rem; color: var(--dim); font-size: .72rem; }
.pad { padding: .8rem; }
.dim { color: var(--dim); font-size: .72rem; }
.panel {
  margin: .5rem .7rem; padding: .6rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; gap: .4rem; font-size: .76rem;
}
.warn-text { color: var(--warn); }
.row { display: flex; gap: .4rem; align-items: center; }
.row.wrap { flex-wrap: wrap; }

.btn {
  background: linear-gradient(180deg, #3a2f52, #241d33);
  border: 1px solid var(--gold-dark); border-radius: var(--radius);
  color: var(--text); font-family: var(--font); font-size: .74rem;
  padding: .35rem .7rem; cursor: pointer; align-self: flex-start;
}
.btn:hover { border-color: var(--gold); background: linear-gradient(180deg, #4a3d68, #2c2340); }
.btn:active { transform: translateY(1px); }
.btn.ok { border-color: #2f7a4a; background: linear-gradient(180deg, #2f6b45, #1c3f2a); }
.btn.warn { border-color: #8a3a3a; background: linear-gradient(180deg, #6b2f2f, #3f1c1c); }
.btn.small { font-size: .68rem; padding: .25rem .5rem; }
.btn.tiny { font-size: .62rem; padding: .12rem .35rem; }
.btn.big { font-size: .9rem; padding: .5rem 1.4rem; min-width: 200px; text-align: center; }
.btn.disabled, .btn:disabled { opacity: .42; cursor: not-allowed; }

.tgl {
  background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--dim); font-family: var(--font); font-size: .66rem; padding: .22rem .5rem; cursor: pointer;
}
.tgl.on { color: #0d0b14; background: var(--gold); border-color: var(--gold); font-weight: bold; }

select, input[type=range], textarea {
  background: #0f0c18; color: var(--text); border: 1px solid var(--line);
  border-radius: var(--radius); font-family: var(--font); font-size: .72rem; padding: .2rem;
}
input[type=range] { padding: 0; }
.save-area { width: 100%; height: 120px; resize: vertical; }
.save-status { font-size: .7rem; border-left: 3px solid var(--ok); padding: .25rem .5rem; background: #0f0c18; border-radius: 3px; }
.save-status.ok { border-left-color: var(--ok); }
.save-status.warn { border-left-color: var(--gold-dark); }
.save-status.bad { border-left-color: var(--danger); color: var(--warn); }
.srow { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.slabel { font-size: .74rem; }

/* ------------------- batalha ------------------- */
.battle-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
#battle-canvas { width: 100%; height: 100%; display: block; background: #0a0810; }
.bt-top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: .35rem .5rem; pointer-events: none;
}
.bt-stage {
  background: rgba(10,8,16,.72); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .2rem .45rem; font-size: .68rem; color: var(--gold);
}
.bt-ctrl { display: flex; gap: .2rem; pointer-events: auto; }
.sbtn {
  background: rgba(10,8,16,.72); border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--dim); font-family: var(--font); font-size: .66rem; padding: .18rem .4rem; cursor: pointer;
}
.sbtn.on { color: #0d0b14; background: var(--gold); border-color: var(--gold); font-weight: bold; }
.bt-toggles {
  position: absolute; top: 2rem; left: .5rem; display: flex; flex-direction: column; gap: .2rem;
  align-items: flex-start;
}
.bt-result {
  position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,8,16,.86); border: 2px solid var(--gold-dark); border-radius: var(--radius);
  padding: .5rem .9rem; text-align: center; pointer-events: none; max-width: 82%;
}
.bt-result.hidden { display: none; }
.bt-result .rt { font-size: 1.1rem; color: var(--gold); font-weight: bold; }
.bt-result.defeat .rt { color: var(--danger); }
.bt-result .rl { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; font-size: .68rem; color: var(--text); margin-top: .2rem; }
.bt-result .rl .drop { color: var(--gold); }

.party-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; gap: .3rem; padding: .3rem; justify-content: center; flex-wrap: wrap;
}
.pcard {
  display: flex; align-items: center; gap: .3rem;
  background: rgba(15,12,24,.86); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .2rem .3rem; min-width: 132px;
}
.pcard.dead { opacity: .4; filter: grayscale(1); }
.pcard-por { border-radius: 3px; }
.pcard-info { flex: 1; min-width: 0; }
.pcard-name { font-size: .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; background: #000; border: 1px solid #000; border-radius: 2px; overflow: hidden; margin-top: 2px; }
.bar i { display: block; height: 100%; width: 100%; }
.bar.hp i { background: linear-gradient(180deg, #6ef09a, #2f8a4f); }
.bar.en i { background: linear-gradient(180deg, #ffe98a, #b08a1a); }
.ult-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: #241d33; border: 2px solid var(--line); color: var(--dim);
  font-family: var(--font); font-size: .8rem; cursor: pointer;
}
.ult-btn.ready {
  border-color: var(--gold); color: #0d0b14; background: var(--gold);
  animation: pulse 1s infinite alternate;
}
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(255,217,74,.6); } to { box-shadow: 0 0 0 6px rgba(255,217,74,0); } }

/* ------------------- mapa ------------------- */
.region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .5rem; padding: .5rem .7rem 1rem; }
.region { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem; }
.region.locked { opacity: .5; }
.rstrip { width: 100%; height: 46px; border-radius: 3px; display: block; }
.rname { color: var(--gold); font-size: .8rem; margin-top: .25rem; }
.rdesc { color: var(--dim); font-size: .66rem; margin-bottom: .3rem; }
.rlock { color: var(--warn); font-size: .68rem; }
.stage-list { display: flex; flex-wrap: wrap; gap: .2rem; margin-bottom: .3rem; }
.stg {
  width: 24px; height: 24px; border-radius: 3px; cursor: pointer;
  background: #0f0c18; border: 1px solid var(--line); color: var(--dim);
  font-family: var(--font); font-size: .62rem;
}
.stg.cleared { color: var(--ok); border-color: #2f6b45; }
.stg.elite { border-color: var(--purple); }
.stg.boss { border-color: var(--danger); color: var(--danger); }
.stg.current { background: var(--gold); color: #0d0b14; font-weight: bold; }
.stg.locked { opacity: .35; cursor: not-allowed; }
.story p { font-size: .78rem; line-height: 1.5; }
.secret-note { color: var(--green); font-size: .7rem; border-top: 1px solid var(--line); padding-top: .4rem; }

/* ------------------- heróis ------------------- */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .5rem; padding: .5rem .7rem 1rem; }
.hcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .45rem; display: flex; flex-direction: column; align-items: center; gap: .18rem; text-align: center;
}
.hcard.in-party { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(255,217,74,.3) inset; }
.hcard.locked { opacity: .72; }
.hname { font-size: .74rem; color: var(--text); }
.hmeta, .hlvl, .hpow { font-size: .62rem; color: var(--dim); }
.hrar { font-size: .6rem; }
.hero-detail h4 { color: var(--gold); margin: .6rem 0 .2rem; font-size: .8rem; }
.hd-head { display: flex; gap: .6rem; align-items: center; }
.hd-name { color: var(--gold); font-size: .9rem; }
.hd-sub { font-size: .68rem; color: var(--dim); }
.hd-pow { font-size: .72rem; color: var(--green); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: .15rem .5rem; }
.stat-row { display: flex; justify-content: space-between; font-size: .68rem; border-bottom: 1px dotted #372e4d; padding: .1rem 0; }
.stat-row .k { color: var(--dim); }
.stat-row.has-tip { cursor: help; }
.equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .3rem; }
.eq-cell {
  background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius);
  padding: .3rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .1rem; text-align: center;
}
.eq-cell:hover { border-color: var(--gold); }
.eq-cell.empty { opacity: .6; }
.eq-name { font-size: .62rem; }
.eq-sub { font-size: .56rem; color: var(--dim); }
.abil-list { display: flex; flex-direction: column; gap: .25rem; }
.abil { display: flex; gap: .4rem; align-items: flex-start; background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius); padding: .3rem; }
.abil-tag { font-size: .55rem; padding: .12rem .3rem; border-radius: 3px; background: var(--line); color: var(--text); white-space: nowrap; }
.abil-tag.ultimate { background: var(--gold); color: #0d0b14; }
.abil-tag.passive { background: #2f6b45; }
.abil-info { flex: 1; }
.abil-name { font-size: .7rem; color: var(--gold); }
.abil-desc { font-size: .64rem; color: var(--dim); }
.abil-cd { font-size: .58rem; color: var(--blue); }

/* ------------------- itens ------------------- */
.filter-bar { display: flex; gap: .3rem; padding: 0 .7rem .3rem; flex-wrap: wrap; align-items: center; }
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .3rem; padding: 0 .7rem .6rem; }
.icell {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-left-width: 3px;
  border-radius: var(--radius); padding: .3rem; cursor: pointer; text-align: center;
}
.icell:hover { background: var(--panel2); }
.icell-name { font-size: .6rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icell-sub { font-size: .55rem; color: var(--dim); }
.icell-eq { position: absolute; top: 2px; right: 3px; font-size: .6rem; color: var(--gold); }
.mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .3rem; padding: 0 .7rem .6rem; }
.mcell { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .3rem; text-align: center; }
.mname { font-size: .58rem; }
.mqty { font-size: .68rem; color: var(--gold); }
.item-list { display: flex; flex-direction: column; gap: .25rem; max-height: 60vh; overflow-y: auto; }
.irow { display: flex; gap: .4rem; align-items: center; background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius); padding: .25rem; cursor: pointer; }
.irow:hover { border-color: var(--gold); }
.irow-name { font-size: .7rem; }
.irow-sub { font-size: .58rem; color: var(--dim); }
.item-detail .id-head { display: flex; gap: .5rem; align-items: center; margin-bottom: .4rem; }
.id-name { font-size: .86rem; }
.id-sub, .id-power, .id-owner { font-size: .66rem; color: var(--dim); }
.setbox { margin-top: .4rem; border-top: 1px solid var(--line); padding-top: .3rem; }
.set-name { font-size: .72rem; }
.set-line { font-size: .62rem; color: var(--dim); }

/* ------------------- oficina ------------------- */
.recipe-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .4rem; padding: .3rem .7rem 1rem; }
.recipe { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem; display: flex; flex-direction: column; gap: .2rem; }
.recipe.locked { opacity: .55; }
.rc-name { color: var(--gold); font-size: .74rem; }
.rc-desc { font-size: .62rem; color: var(--dim); }
.rc-cost { display: flex; flex-wrap: wrap; gap: .3rem; font-size: .6rem; }
.rc-cost .ok { color: var(--ok); }
.rc-cost .no { color: var(--danger); }
.rc-lock { font-size: .6rem; color: var(--warn); }

/* ------------------- missões ------------------- */
.tabs { display: flex; gap: .2rem; padding: 0 .7rem .3rem; flex-wrap: wrap; }
.tab { background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius); color: var(--dim); font-family: var(--font); font-size: .64rem; padding: .2rem .45rem; cursor: pointer; }
.tab.on { color: #0d0b14; background: var(--gold); border-color: var(--gold); }
.quest-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .4rem; padding: 0 .7rem 1rem; }
.quest { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .45rem; display: flex; flex-direction: column; gap: .18rem; }
.quest.done { border-color: var(--ok); }
.quest.claimed { opacity: .55; }
.q-title { color: var(--gold); font-size: .76rem; }
.q-meta { font-size: .58rem; color: var(--dim); }
.q-desc { font-size: .66rem; }
.q-prog { height: 6px; background: #000; border-radius: 3px; overflow: hidden; }
.q-prog i { display: block; height: 100%; background: linear-gradient(90deg, #4fd07a, #a8ff9c); }
.q-progtext { font-size: .58rem; color: var(--dim); }
.q-rw { display: flex; gap: .35rem; flex-wrap: wrap; font-size: .58rem; color: var(--gold); }

/* ------------------- bestiário ------------------- */
.bes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .35rem; padding: .3rem .7rem 1rem; }
.bcell { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .3rem; text-align: center; cursor: pointer; }
.bcell.unknown { opacity: .45; filter: grayscale(1) brightness(.6); cursor: default; }
.bname { font-size: .62rem; }
.bsub { font-size: .55rem; color: var(--dim); }
.btag { position: absolute; top: 2px; right: 2px; font-size: .5rem; padding: 0 .2rem; border-radius: 2px; background: var(--purple); color: #0d0b14; }
.btag.boss { background: var(--danger); }

/* ------------------- companheiros ------------------- */
.comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .45rem; padding: .3rem .7rem 1rem; }
.ccard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem; display: flex; flex-direction: column; align-items: center; gap: .18rem; text-align: center; }
.ccard.active { border-color: var(--gold); }
.ccard.locked { opacity: .6; }
.cname { color: var(--gold); font-size: .72rem; }
.cdesc, .clvl, .cbonus { font-size: .6rem; color: var(--dim); }

/* ------------------- melhorias ------------------- */
.up-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .4rem; padding: .3rem .7rem 1rem; }
.upg { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem; display: flex; flex-direction: column; gap: .2rem; }
.up-name { color: var(--gold); font-size: .74rem; }
.up-desc { font-size: .62rem; color: var(--dim); }

/* ------------------- conquistas ------------------- */
.ach-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .35rem; padding: .3rem .7rem 1rem; }
.ach { display: flex; gap: .4rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem; }
.ach.got { border-color: var(--gold); }
.ach-ic { font-size: 1.1rem; }
.ach-name { font-size: .74rem; color: var(--gold); }
.ach-desc { font-size: .62rem; color: var(--dim); }
.ach-prog { font-size: .56rem; color: var(--dim); }
.ach-rw { font-size: .56rem; color: var(--green); text-align: right; }

/* ------------------- modais ------------------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(5,4,10,.78);
  display: flex; align-items: center; justify-content: center; z-index: 60; padding: .6rem;
}
.modal {
  background: linear-gradient(180deg, #241d33, #151020);
  border: 2px solid var(--gold-dark); border-radius: var(--radius);
  max-width: 520px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: 0 8px 40px rgba(0,0,0,.7);
}
.modal.wide { max-width: 760px; }
.modal-title {
  display: flex; justify-content: space-between; align-items: center;
  padding: .4rem .6rem; border-bottom: 1px solid var(--line); color: var(--gold); font-size: .84rem;
}
.modal-title .x { background: none; border: none; color: var(--dim); cursor: pointer; font-size: .9rem; font-family: var(--font); }
.modal-body { padding: .6rem; overflow-y: auto; font-size: .74rem; }
.modal-body p { margin: .3rem 0; }
.modal-actions { display: flex; gap: .3rem; padding: .4rem .6rem; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal-actions .btn { align-self: auto; }

/* ------------------- menu ------------------- */
.menu-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: radial-gradient(circle at 50% 30%, #2a1a44, #0a0810 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem;
  padding: 1rem; overflow-y: auto;
}

.menu-foot { color: var(--dim); font-size: .62rem; margin-top: .8rem; }

/* ------------------- avisos ------------------- */
#toasts { position: fixed; top: 3rem; right: .5rem; display: flex; flex-direction: column; gap: .25rem; z-index: 90; pointer-events: none; }
.toast {
  background: rgba(20,16,32,.94); border: 1px solid var(--gold-dark); border-radius: var(--radius);
  color: var(--text); padding: .3rem .55rem; font-size: .68rem; max-width: 260px;
  animation: slidein .25s ease;
}
.toast.ok { border-color: var(--ok); }
.toast.warn { border-color: var(--warn); }
.toast.out { opacity: 0; transition: opacity .35s; }
@keyframes slidein { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Dica de tela: discreta, não bloqueia nada e pode ser fechada. */
#hint-pop {
  position: fixed; left: 50%; bottom: 4.2rem; transform: translate(-50%, 16px);
  display: flex; align-items: center; gap: .45rem; z-index: 70;
  background: rgba(20,16,32,.95); border: 1px solid var(--gold-dark); border-radius: var(--radius);
  padding: .35rem .4rem .35rem .55rem;
  /* largura explícita: com left:50% e largura automática o popup só receberia
     metade da viewport e o texto quebraria em quatro linhas */
  width: min(92vw, 340px);
  box-shadow: 0 4px 18px rgba(0,0,0,.55);
  opacity: 0; transition: opacity .25s ease, transform .25s ease;
}
#hint-pop.on { opacity: 1; transform: translate(-50%, 0); }
#hint-pop .hp-ic { font-size: .9rem; flex: 0 0 auto; }
#hint-pop .hp-text { font-size: .66rem; color: var(--text); line-height: 1.35; }
#hint-pop .hp-close {
  flex: 0 0 auto; background: none; border: none; color: var(--dim);
  font-family: var(--font); font-size: .8rem; cursor: pointer; padding: .1rem .25rem; border-radius: 3px;
}
#hint-pop .hp-close:hover { color: var(--gold); background: rgba(255,217,74,.12); }

.daily-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: .3rem; }
.dcell { background: #0f0c18; border: 1px solid var(--line); border-radius: var(--radius); padding: .3rem; font-size: .6rem; text-align: center; }
.dcell.got { opacity: .5; }
.dcell.next { border-color: var(--gold); }
.dday { color: var(--gold); font-size: .66rem; }

/* ------------------- responsivo ------------------- */
@media (max-width: 620px) {

  .menu-title { font-size: 1.1rem; }
}
@media (min-height: 700px) and (min-width: 900px) {
  .party-bar { padding: .5rem; }
}

<script>

/* ======== src/util.js ======== */
/* =============================================================
 * util.js — helpers compartilhados (formatação, RNG, DOM, math)
 * Não depende de nenhum outro módulo. Deve carregar primeiro.
 * ============================================================= */
(function () {
  'use strict';
  const G = (window.LDB = window.LDB || {});
  const U = (G.util = {});

  /* ---------- Números ---------- */
  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd'];

  /** Formata números grandes: 1234 -> "1.23K", 5.4e9 -> "5.40B" */
  U.fmt = function (n, decimals) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    const neg = n < 0;
    n = Math.abs(n);
    if (n < 1000) {
      const d = decimals === undefined ? (n < 10 && n % 1 !== 0 ? 1 : 0) : decimals;
      return (neg ? '-' : '') + n.toFixed(d).replace(/\.0+$/, '');
    }
    let tier = Math.floor(Math.log10(n) / 3);
    if (tier >= SUFFIX.length) tier = SUFFIX.length - 1;
    const scaled = n / Math.pow(10, tier * 3);
    const d = decimals === undefined ? (scaled < 10 ? 2 : scaled < 100 ? 1 : 0) : decimals;
    return (neg ? '-' : '') + scaled.toFixed(d) + SUFFIX[tier];
  };

  /** Percentual legível */
  U.pct = function (v, d) { return (v * 100).toFixed(d === undefined ? 1 : d).replace(/\.0$/, '') + '%'; };

  /** Tempo em segundos -> "1h 23m 45s" */
  U.time = function (sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + 'h ' + m + 'm';
    if (m > 0) return m + 'm ' + s + 's';
    return s + 's';
  };

  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.round = (v, d) => { const p = Math.pow(10, d || 0); return Math.round(v * p) / p; };

  /* ---------- Aleatoriedade ---------- */
  /** PRNG determinístico (mulberry32) — usado para gerar itens reproduzíveis */
  U.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.rand = (a, b) => a + Math.random() * (b - a);
  U.randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.chance = (p) => Math.random() < p;
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  /** Escolha ponderada: items = [{w:peso, ...}] */
  U.weighted = function (items, key) {
    key = key || 'w';
    let total = 0;
    for (const it of items) total += it[key] || 0;
    let r = Math.random() * total;
    for (const it of items) { r -= it[key] || 0; if (r <= 0) return it; }
    return items[items.length - 1];
  };

  U.uid = (() => { let n = 1; return (p) => (p || 'id') + '_' + (n++).toString(36) + Math.floor(Math.random() * 1296).toString(36); })();

  U.clone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------- DOM ---------- */
  U.el = function (tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      }
    }
    if (children) {
      const list = Array.isArray(children) ? children : [children];
      for (const c of list) { if (c === null || c === undefined || c === false) continue; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
    }
    return e;
  };
  U.qs = (sel, root) => (root || document).querySelector(sel);
  U.qsa = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  U.clear = (node) => { while (node && node.firstChild) node.removeChild(node.firstChild); return node; };
  U.esc = function (s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* ---------- Cores ---------- */
  /** Clareia/escurece uma cor hex. amt: -1..1 */
  U.shade = function (hex, amt) {
    const c = U.hex2rgb(hex);
    const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
    return U.rgb2hex(
      Math.round((f - c[0]) * p) + c[0],
      Math.round((f - c[1]) * p) + c[1],
      Math.round((f - c[2]) * p) + c[2]
    );
  };
  U.hex2rgb = function (hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  U.rgb2hex = function (r, g, b) {
    const h = (v) => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
    return '#' + h(r) + h(g) + h(b);
  };
  U.mix = function (a, b, t) {
    const x = U.hex2rgb(a), y = U.hex2rgb(b);
    return U.rgb2hex(U.lerp(x[0], y[0], t), U.lerp(x[1], y[1], t), U.lerp(x[2], y[2], t));
  };

  /* ---------- Eventos ---------- */
  U.emitter = function () {
    const map = {};
    return {
      on(ev, fn) { (map[ev] = map[ev] || []).push(fn); return fn; },
      off(ev, fn) { if (map[ev]) map[ev] = map[ev].filter((f) => f !== fn); },
      emit(ev, data) { const l = map[ev]; if (!l) return; for (let i = 0; i < l.length; i++) { try { l[i](data); } catch (e) { console.warn('[LDB] handler', ev, e); } } }
    };
  };

  /** Pool de objetos reutilizáveis (números de dano, partículas) */
  U.Pool = function (factory, reset) {
    const free = [];
    return {
      get() { const o = free.pop() || factory(); return o; },
      put(o) { if (reset) reset(o); if (free.length < 512) free.push(o); },
      size() { return free.length; }
    };
  };

  U.now = () => Date.now();
})();

    let s = table[key];
    if (s === undefined) s = STR['pt-BR'][key];
    if (s === undefined) return key;
    if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    return s;
  };

  /** Nome localizado de um objeto de dados que tenha name/nameEn */
  G.tn = function (obj) {

    return G.locale === 'en' && obj.nameEn ? obj.nameEn : (obj.name || obj.id || '');

    return G.locale === 'en' && obj[en] ? obj[en] : (obj[field] || '');

  G.balance.curve = function (stage, exp) {
    const e = G.balance.enemy;
    return Math.pow((1 + (stage + e.offset) * e.k) / (1 + e.offset * e.k), exp);
  };

  /** Multiplicador elemental de atacante contra defensor */
  G.balance.elementMult = function (atk, def) {
    const B = G.balance, o = B.elements.order;
    if (!atk || !def || atk === B.elements.neutral || def === B.elements.neutral) return 1;
    const ia = o.indexOf(atk), id = o.indexOf(def);
    if (ia < 0 || id < 0) return 1;
    if ((ia + 1) % o.length === id) return 1 + B.combat.elementBonus;
    if ((id + 1) % o.length === ia) return 1 - B.combat.elementPenalty;
    return 1;
  };

  G.stages = [];
  G.regions.forEach((region, ri) => {
    for (let i = 0; i < 12; i++) {
      const n = i + 1;
      const type = n === 12 ? 'boss' : (n === 4 || n === 8 ? 'elite' : 'normal');
      const abs = G.stages.length;
      G.stages.push({
        index: abs,
        region: region.id,
        regionIndex: ri,
        num: n,
        type: type,
        name: STAGE_NAMES[region.id][i],
        nameEn: STAGE_NAMES_EN[region.id][i],
        enemyPool: type === 'boss' ? [region.boss] : (type === 'elite' ? region.elites : region.enemies),
        // Poder recomendado: derivado da mesma curva dos inimigos, só como orientação.
        power: Math.floor(1400 * G.balance.curve(abs, 2.2) * (type === 'boss' ? 1.5 : type === 'elite' ? 1.2 : 1)),
        secret: region.secret && region.secret.stage === n ? region.secret.id : null
      });
    }
  });

  G.STAGE_COUNT = G.stages.length;

  /** Estágio infinito após o conteúdo principal (progresso idle contínuo) */
  G.endlessStage = function (abs) {
    const over = abs - G.STAGE_COUNT;
    const region = G.regionById.eclipse;
    return {
      index: abs, region: 'eclipse', regionIndex: 9,
      num: 12 + over + 1, type: over % 10 === 9 ? 'boss' : (over % 5 === 4 ? 'elite' : 'normal'),
      name: 'Profundezas do Eclipse ' + (over + 1),
      nameEn: 'Eclipse Depths ' + (over + 1),
      enemyPool: over % 10 === 9 ? [region.boss] : (over % 5 === 4 ? region.elites : region.enemies),
      power: Math.floor(220 * Math.pow(1.135, G.STAGE_COUNT) * Math.pow(1.16, over + 1)),
      secret: null, endless: true
    };
  };

  G.getStage = function (abs) {
    return abs < G.STAGE_COUNT ? G.stages[abs] : G.endlessStage(abs);
  };
})();

/* ======== src/art.js ======== */
/* =============================================================
 * art.js — gerador procedural de pixel art (16 bits).
 * Tudo é desenhado em canvas de baixa resolução (1 unidade = 1 pixel)
 * e ampliado com suavização desligada, o que dá o visual retrô.
 *
 * API:
 *   art.sprite(spec, pose)   -> canvas 48x48 (ou 64x64 para grandes)
 *   art.portrait(spec)       -> canvas 40x40 com moldura
 *   art.icon(kind, color)    -> canvas 16x16
 *   art.background(pal, w,h) -> canvas de cenário
 *   art.logo(w, h)           -> canvas do logotipo
 * ============================================================= */
(function () {
  'use strict';
  const G = (window.LDB = window.LDB || {});
  const U = G.util;
  const art = (G.art = {});
  const cache = {};

  function mk(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    return c;
  }
  art.mk = mk;

  /* ---------- primitivas de pixel ---------- */
  function P(ctx, x, y, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, 1, 1); }
  function R(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); }
  function ell(ctx, cx, cy, rx, ry, col) {
    ctx.fillStyle = col;
    for (let y = -ry; y <= ry; y++) {
      const t = 1 - (y * y) / (ry * ry);
      if (t <= 0) continue;
      const w = Math.round(rx * Math.sqrt(t));
      ctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    }
  }
  /** massa com sombreamento em 3 tons */
  function mass(ctx, cx, cy, rx, ry, pal, lightDir) {
    ell(ctx, cx, cy, rx, ry, pal.dark);
    ell(ctx, cx, cy, rx - 1, ry - 1, pal.main);
    const d = lightDir === undefined ? -1 : lightDir;
    ell(ctx, cx + d * Math.max(1, rx * 0.28), cy - Math.max(1, ry * 0.3), Math.max(1, rx * 0.45), Math.max(1, ry * 0.42), pal.light);
  }
  function box(ctx, x, y, w, h, pal) {
    R(ctx, x, y, w, h, pal.dark);
    R(ctx, x + 1, y + 1, w - 2, h - 2, pal.main);
    R(ctx, x + 1, y + 1, Math.max(1, (w - 2) * 0.5), Math.max(1, (h - 2) * 0.35), pal.light);
  }
  function lineTo(ctx, x0, y0, x1, y1, col, thick) {
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(Math.abs(dx), Math.abs(dy));
    for (let i = 0; i <= n; i++) {
      const x = x0 + (dx * i) / n, y = y0 + (dy * i) / n;
      R(ctx, Math.round(x), Math.round(y), thick || 1, thick || 1, col);
    }
  }

  const DEF_PAL = { main: '#7a7a86', dark: '#2e2e36', light: '#c2c2ce', accent: '#ffd94a', skin: '#c9a07a', eye: '#ffffff' };

  /* =========================================================
   * ARMAS
   * ======================================================= */
  function drawWeapon(ctx, kind, x, y, pal, raised) {
    const a = pal.accent || '#d0d0d0';
    const d = pal.dark;
    switch (kind) {
      case 'spear':
        lineTo(ctx, x, y + (raised ? -8 : 6), x + (raised ? 6 : 2), y - 14, '#8a6238', 1);
        R(ctx, x + (raised ? 6 : 2), y - 17, 2, 4, a); P(ctx, x + (raised ? 6 : 2), y - 18, '#ffffff');
        break;
      case 'greatsword':
        lineTo(ctx, x, y + 4, x + (raised ? 7 : 3), y - 13, a, 2);
        R(ctx, x - 1, y + 3, 4, 2, d);
        break;
      case 'bow':
        for (let i = -7; i <= 7; i++) {
          const bx = x + Math.round(3 * Math.cos(i / 9)) + (raised ? 2 : 0);
          P(ctx, bx, y - 3 + i, '#8a6238');
        }
        lineTo(ctx, x - 1 + (raised ? 2 : 0), y - 10, x - 1 + (raised ? 2 : 0), y + 4, '#e8e8e8', 1);
        break;
      case 'crossbow':
        R(ctx, x - 1, y - 3, 8, 2, '#6a4a2a');
        R(ctx, x + 1, y - 6, 2, 8, d);
        R(ctx, x + 5, y - 4, 2, 4, a);
        break;
      case 'staff':
        lineTo(ctx, x, y + 6, x + (raised ? 4 : 1), y - 14, '#8a6238', 1);
        ell(ctx, x + (raised ? 4 : 1), y - 16, 2, 2, a);
        P(ctx, x + (raised ? 4 : 1), y - 17, '#ffffff');
        break;
      case 'orb':
        ell(ctx, x + (raised ? 5 : 3), y - (raised ? 10 : 4), 3, 3, a);
        ell(ctx, x + (raised ? 4 : 2), y - (raised ? 11 : 5), 1, 1, '#ffffff');
        break;
      case 'daggers':
        lineTo(ctx, x, y + 2, x + (raised ? 5 : 3), y - (raised ? 8 : 4), a, 1);
        lineTo(ctx, x - 6, y + 2, x - 8, y - (raised ? 6 : 3), a, 1);
        break;
      case 'lute':
        ell(ctx, x + 2, y + 1, 4, 5, '#a86a3a');
        ell(ctx, x + 2, y + 1, 1, 1, d);
        lineTo(ctx, x + 4, y - 3, x + 7, y - 10, '#6a4a2a', 1);
        break;
      case 'scythe':
        lineTo(ctx, x, y + 6, x + 2, y - 14, '#4a4a52', 1);
        for (let i = 0; i < 8; i++) P(ctx, x + 2 + i, y - 14 + Math.round(i * i * 0.14), a);
        break;
      default: break;
    }
  }

  /* =========================================================
   * ARQUÉTIPOS
   * ======================================================= */
  function drawHumanoid(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const raised = pose === 'action';
    const slim = s.build === 'slim', heavy = s.build === 'heavy';
    const bw = slim ? 4 : heavy ? 7 : 5;         // meia-largura do torso
    const cx = 24, feet = 45;
    const legH = 9, torsoH = slim ? 12 : 13;
    const torsoY = feet - legH - torsoH;
    const headR = slim ? 4 : 5;
    const headY = torsoY - headR - 1;

    // sombra no chão
    ell(ctx, cx, feet + 1, bw + 3, 2, 'rgba(0,0,0,0.28)');

    // capa atrás
    if (s.cape) {
      ctx.fillStyle = U.shade(pal.main, -0.35);
      for (let y = 0; y < torsoH + 6; y++) {
        const w = bw + 1 + Math.round(y * 0.28);
        ctx.fillRect(cx - w, torsoY + y, w * 2, 1);
      }
    }

    // pernas
    const legCol = U.shade(pal.dark, 0.12);
    R(ctx, cx - bw + 1, feet - legH, 2, legH, legCol);
    R(ctx, cx + bw - 3, feet - legH, 2, legH, legCol);
    R(ctx, cx - bw + 1, feet - 1, 3, 2, pal.dark);
    R(ctx, cx + bw - 4, feet - 1, 3, 2, pal.dark);

    // torso
    R(ctx, cx - bw, torsoY, bw * 2, torsoH, pal.dark);
    R(ctx, cx - bw + 1, torsoY + 1, bw * 2 - 2, torsoH - 2, pal.main);
    R(ctx, cx - bw + 1, torsoY + 1, bw - 1, Math.round(torsoH * 0.5), pal.light);
    if (s.skeletal) {
      for (let i = 0; i < 3; i++) R(ctx, cx - bw + 2, torsoY + 3 + i * 3, bw * 2 - 4, 1, pal.dark);
    }

    // braços
    const armY = torsoY + 2;
    const rArmY = raised ? armY - 5 : armY;
    R(ctx, cx - bw - 2, armY, 2, torsoH - 3, U.shade(pal.main, -0.2));
    R(ctx, cx + bw, rArmY, 2, torsoH - 3, U.shade(pal.main, -0.1));

    // cabeça
    ell(ctx, cx, headY, headR, headR, pal.dark);
    ell(ctx, cx, headY, headR - 1, headR - 1, pal.skin || pal.main);
    // olhos
    const eyeC = pal.eye || '#fff';
    P(ctx, cx - 2, headY - 1, eyeC); P(ctx, cx + 2, headY - 1, eyeC);
    if (s.mask) { R(ctx, cx - headR + 1, headY - 2, headR * 2 - 2, 3, pal.accent); P(ctx, cx - 2, headY - 1, '#000'); P(ctx, cx + 2, headY - 1, '#000'); }

    // chapéu / cabelo
    switch (s.hat) {
      case 'leaf':
        for (let i = -1; i <= 1; i++) ell(ctx, cx + i * 4, headY - headR - 1, 3, 2, pal.light);
        break;
      case 'hood':
        ell(ctx, cx, headY - 1, headR + 1, headR + 1, U.shade(pal.main, -0.25));
        ell(ctx, cx, headY + 1, headR - 1, headR - 1, '#00000000');
        ell(ctx, cx, headY + 1, headR - 1, headR - 2, pal.skin || pal.main);
        P(ctx, cx - 2, headY, eyeC); P(ctx, cx + 2, headY, eyeC);
        break;
      case 'pointed':
        for (let i = 0; i < 9; i++) R(ctx, cx - 5 + Math.round(i * 0.55), headY - headR - i, Math.max(1, 10 - i), 1, U.shade(pal.main, -0.15));
        R(ctx, cx - 6, headY - headR, 12, 2, pal.accent);
        break;
      case 'wide':
        R(ctx, cx - 8, headY - headR, 16, 2, U.shade(pal.main, -0.3));
        R(ctx, cx - 4, headY - headR - 3, 8, 3, U.shade(pal.main, -0.15));
        break;
      case 'cap':
        R(ctx, cx - headR, headY - headR, headR * 2, 3, pal.accent);
        R(ctx, cx + headR - 1, headY - headR + 1, 3, 1, U.shade(pal.accent, -0.3));
        break;
      case 'flower':
        for (let i = 0; i < 5; i++) {
          const a2 = (i / 5) * Math.PI * 2;
          ell(ctx, cx + Math.cos(a2) * 4, headY - headR - 1 + Math.sin(a2) * 2, 1, 1, pal.accent);
        }
        break;
      case 'hair':
        ell(ctx, cx, headY - headR + 1, headR, 3, pal.accent);
        for (let i = -3; i <= 3; i += 2) lineTo(ctx, cx + i, headY - headR, cx + i * 1.6, headY - headR - 4, pal.accent, 1);
        break;
      case 'mask':
        R(ctx, cx - headR, headY - 2, headR * 2, 4, pal.accent);
        P(ctx, cx - 2, headY, '#1a1a1a'); P(ctx, cx + 2, headY, '#1a1a1a');
        break;
      default: break;
    }

    // arma
    if (s.weapon && s.weapon !== 'none') drawWeapon(ctx, s.weapon, cx + bw + 2, torsoY + 8, pal, raised);
    if (s.backwards) { // pés invertidos (referência lúdica)
      R(ctx, cx - bw - 1, feet - 1, 3, 2, pal.accent);
      R(ctx, cx + bw - 2, feet - 1, 3, 2, pal.accent);
    }
  }

  function drawBeast(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const big = s.big || s.boss;
    const cx = 24, feet = 45;
    const bodyRx = big ? 13 : 10, bodyRy = big ? 8 : 6;
    const bodyY = feet - (big ? 14 : 11);
    ell(ctx, cx, feet + 1, bodyRx + 2, 2, 'rgba(0,0,0,0.28)');

    if (s.biped) {
      // postura ereta: pernas grossas, pés e ombros marcados
      const legW = big ? 6 : 5;
      R(ctx, cx - legW - 1, feet - 11, legW, 11, U.shade(pal.dark, 0.12));
      R(ctx, cx + 1, feet - 11, legW, 11, U.shade(pal.dark, 0.12));
      R(ctx, cx - legW - 2, feet - 2, legW + 2, 2, pal.dark);
      R(ctx, cx + 1, feet - 2, legW + 2, 2, pal.dark);
      mass(ctx, cx, feet - 19, bodyRx - 1, bodyRy + 4, pal);
      mass(ctx, cx, feet - 29, bodyRy + 1, bodyRy, pal);
      // orelhas
      if (!s.oneEye) {
        ell(ctx, cx - bodyRy, feet - 33, 2, 3, pal.dark);
        ell(ctx, cx + bodyRy, feet - 33, 2, 3, pal.dark);
      }
      if (s.oneEye) { ell(ctx, cx, feet - 29, 2, 2, pal.eye); P(ctx, cx, feet - 29, '#1a0000'); }
      else { P(ctx, cx - 3, feet - 29, pal.eye); P(ctx, cx + 3, feet - 29, pal.eye); }
      // braços
      R(ctx, cx - bodyRx, feet - 24, 3, 10, U.shade(pal.main, -0.2));
      R(ctx, cx + bodyRx - 3, feet - 24 - (pose === 'action' ? 5 : 0), 3, 10, U.shade(pal.main, -0.1));
      if (s.horns) { lineTo(ctx, cx - 4, feet - 33, cx - 7, feet - 39, pal.light, 1); lineTo(ctx, cx + 4, feet - 33, cx + 7, feet - 39, pal.light, 1); }
      return;
    }

    // quadrúpede
    const legY = bodyY + bodyRy - 1;
    for (const lx of [-bodyRx + 3, -bodyRx + 6, bodyRx - 6, bodyRx - 3]) {
      R(ctx, cx + lx, legY, 2, feet - legY, U.shade(pal.dark, 0.1));
    }
    mass(ctx, cx, bodyY, bodyRx, bodyRy, pal);
    if (s.shell) { for (let i = -bodyRx + 2; i < bodyRx - 1; i += 3) R(ctx, cx + i, bodyY - bodyRy, 2, bodyRy, U.shade(pal.light, -0.1)); }
    if (s.fat) ell(ctx, cx, bodyY + 2, bodyRx - 1, bodyRy - 1, U.shade(pal.main, 0.08));

    // pescoço e cabeça (frente = esquerda), erguidos para destacar a silhueta
    const hr = big ? 7 : 6;
    const hx = cx - bodyRx - 1, hy = bodyY - bodyRy - (big ? 4 : 3) - (pose === 'action' ? 3 : 0);
    lineTo(ctx, cx - bodyRx + 2, bodyY - bodyRy + 1, hx + 2, hy + 2, pal.main, 4);
    mass(ctx, hx, hy, hr, hr - 1, pal);
    // orelhas
    ell(ctx, hx + 2, hy - hr, 2, 3, pal.dark);
    ell(ctx, hx - 3, hy - hr + 1, 2, 3, pal.dark);
    P(ctx, hx - 2, hy - 1, pal.eye); P(ctx, hx + 2, hy - 1, pal.eye);
    // focinho
    R(ctx, hx - hr - 1, hy + 1, 4, 3, U.shade(pal.dark, 0.18));
    P(ctx, hx - hr - 1, hy + 1, pal.dark);
    if (s.horns) { lineTo(ctx, hx - 2, hy - hr + 1, hx - 5, hy - hr - 6, pal.light, 1); lineTo(ctx, hx + 3, hy - hr + 1, hx + 6, hy - hr - 6, pal.light, 1); }
    if (s.mane) for (let i = 0; i < 7; i++) lineTo(ctx, hx + 3, hy - 3 + i, hx + 8, hy - 6 + i, pal.accent, 1);
    if (s.tail) {
      let tx = cx + bodyRx, ty = bodyY - 1;
      for (let i = 0; i < 8; i++) { P(ctx, tx + i, ty - Math.round(Math.sin(i / 2.2) * 4), pal.main); P(ctx, tx + i, ty + 1 - Math.round(Math.sin(i / 2.2) * 4), pal.dark); }
    }
    if (s.spectral) { ctx.globalAlpha = 0.75; ell(ctx, cx, bodyY, bodyRx + 2, bodyRy + 2, pal.light); ctx.globalAlpha = 1; }
  }

  function drawSerpent(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const big = s.boss || s.big;
    const cx = 24, base = 44;
    const seg = big ? 14 : 10, r = big ? 5 : 3;
    ell(ctx, cx, base + 2, 12, 2, 'rgba(0,0,0,0.25)');
    for (let i = seg - 1; i >= 0; i--) {
      const t = i / seg;
      const x = cx + Math.sin(t * Math.PI * 2.2 + (pose === 'action' ? 0.6 : 0)) * (big ? 13 : 9);
      const y = base - t * (big ? 34 : 24);
      const rr = r * (1 - t * 0.45);
      ell(ctx, x, y, rr + 1, rr + 1, pal.dark);
      ell(ctx, x, y, rr, rr, i % 2 ? pal.main : pal.light);
    }
    // cabeça no topo
    const hx = cx + Math.sin(Math.PI * 2.2 + (pose === 'action' ? 0.6 : 0)) * (big ? 13 : 9);
    const hy = base - (big ? 34 : 24);
    mass(ctx, hx, hy, r + 2, r + 1, pal);
    P(ctx, hx - 1, hy - 1, pal.eye); P(ctx, hx + 2, hy - 1, pal.eye);
    lineTo(ctx, hx + 3, hy + 1, hx + 6, hy + 2, pal.accent, 1);
  }

  function drawSpirit(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, cy = s.small ? 30 : 26;
    const rx = s.small ? 5 : (s.big ? 11 : 8);
    ctx.globalAlpha = 0.9;
    // cauda esfumaçada
    for (let i = 0; i < 12; i++) {
      const t = i / 12;
      const w = rx * (1 - t) + 1;
      ell(ctx, cx + Math.sin(t * 5 + (pose === 'action' ? 1 : 0)) * 3, cy + rx + i, w, 1, i % 2 ? pal.main : pal.dark);
    }
    mass(ctx, cx, cy, rx, rx, pal);
    ctx.globalAlpha = 1;
    P(ctx, cx - 2, cy - 1, pal.eye); P(ctx, cx + 2, cy - 1, pal.eye);
    if (s.hair) for (let i = -rx; i <= rx; i += 2) lineTo(ctx, cx + i, cy - rx + 1, cx + i * 1.5, cy - rx - 5, pal.light, 1);
    if (s.mask) { R(ctx, cx - rx + 1, cy - 2, rx * 2 - 2, 4, pal.accent); P(ctx, cx - 2, cy, '#1a1a1a'); P(ctx, cx + 2, cy, '#1a1a1a'); }
    if (s.swirl) for (let i = 0; i < 22; i++) { const a2 = i * 0.55, rr = 3 + i * 0.6; P(ctx, cx + Math.cos(a2) * rr, cy + Math.sin(a2) * rr * 0.6, pal.light); }
    if (s.glow) { ctx.globalAlpha = 0.35; ell(ctx, cx, cy, rx + 4, rx + 4, pal.light); ctx.globalAlpha = 1; }
  }

  function drawPlant(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, feet = 45;
    ell(ctx, cx, feet + 1, 9, 2, 'rgba(0,0,0,0.25)');
    // raízes
    for (let i = -3; i <= 3; i += 2) lineTo(ctx, cx, feet - 4, cx + i * 3, feet, pal.dark, 1);
    // caule
    const h = s.boss ? 30 : 22;
    for (let y = 0; y < h; y++) {
      const x = cx + Math.round(Math.sin(y / 6 + (pose === 'action' ? 0.8 : 0)) * 2);
      R(ctx, x - 2, feet - 4 - y, 4, 1, y % 3 ? pal.main : pal.dark);
    }
    const topY = feet - 4 - h;
    if (s.humanoidTree) {
      mass(ctx, cx, topY + 4, 6, 7, pal);
      P(ctx, cx - 2, topY + 2, pal.eye); P(ctx, cx + 2, topY + 2, pal.eye);
      for (let i = 0; i < 4; i++) lineTo(ctx, cx, topY - 1, cx + (i - 1.5) * 6, topY - 8, pal.dark, 1);
    } else {
      mass(ctx, cx, topY, 6, 5, pal);
      P(ctx, cx - 2, topY - 1, pal.eye); P(ctx, cx + 2, topY - 1, pal.eye);
      // pétalas / folhas
      for (let i = 0; i < 6; i++) {
        const a2 = (i / 6) * Math.PI * 2;
        ell(ctx, cx + Math.cos(a2) * 7, topY + Math.sin(a2) * 5, 2, 2, pal.accent);
      }
    }
    if (s.vines) for (let i = 0; i < 3; i++) {
      const sx = cx + (i - 1) * 7;
      for (let y = 0; y < 12; y++) P(ctx, sx + Math.round(Math.sin(y / 3) * 2), feet - 8 - y, pal.light);
    }
    if (s.crystal) for (let i = 0; i < 5; i++) ell(ctx, cx + (i - 2) * 4, feet - 10 - (i % 3) * 4, 1, 2, pal.accent);
  }

  function drawGolem(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const big = s.big || s.boss;
    const cx = 24, feet = 45;
    const w = big ? 9 : 7;
    ell(ctx, cx, feet + 1, w + 3, 2, 'rgba(0,0,0,0.3)');
    box(ctx, cx - w + 1, feet - 8, 5, 8, pal);
    box(ctx, cx + w - 6, feet - 8, 5, 8, pal);
    box(ctx, cx - w, feet - 22, w * 2, 15, pal);
    box(ctx, cx - 5, feet - 31, 10, 9, pal);
    P(ctx, cx - 2, feet - 27, pal.eye); P(ctx, cx + 2, feet - 27, pal.eye);
    const armUp = pose === 'action' ? 5 : 0;
    box(ctx, cx - w - 4, feet - 21 - armUp, 4, 12, pal);
    box(ctx, cx + w, feet - 21 - armUp, 4, 12, pal);
    if (s.crystal) for (let i = 0; i < 5; i++) { const a2 = i * 1.3; ell(ctx, cx + Math.cos(a2) * 6, feet - 18 + Math.sin(a2) * 5, 1, 2, pal.accent); }
    if (s.forge) { ell(ctx, cx + w + 4, feet - 14, 2, 2, '#ff8a3a'); R(ctx, cx + w + 2, feet - 12, 5, 2, '#4a3226'); }
  }

  function drawInsect(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, cy = 34, legs = s.legs || 6;
    ell(ctx, cx, 45, 9, 2, 'rgba(0,0,0,0.25)');
    for (let i = 0; i < legs; i++) {
      const side = i % 2 ? 1 : -1;
      const k = Math.floor(i / 2);
      lineTo(ctx, cx + side * 4, cy + 1 + k, cx + side * 11, 44 - k * 2, pal.dark, 1);
    }
    mass(ctx, cx + 3, cy, 7, 5, pal);
    mass(ctx, cx - 5, cy - 1, 4, 4, pal);
    P(ctx, cx - 7, cy - 2, pal.eye); P(ctx, cx - 4, cy - 2, pal.eye);
    lineTo(ctx, cx - 6, cy - 4, cx - 9, cy - 9, pal.dark, 1);
    lineTo(ctx, cx - 3, cy - 4, cx - 1, cy - 10, pal.dark, 1);
    if (s.glow) { ctx.globalAlpha = 0.45; ell(ctx, cx + 6, cy + 2, 5, 4, pal.light); ctx.globalAlpha = 1; }
  }

  function drawBird(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const big = s.big;
    const cx = 24, cy = s.small ? 30 : 28;
    const r = s.small ? 4 : (big ? 8 : 6);
    ell(ctx, cx, 45, r + 2, 2, 'rgba(0,0,0,0.22)');
    const flap = pose === 'action' ? -4 : 0;
    // asas
    for (const side of [-1, 1]) {
      ctx.fillStyle = U.shade(pal.main, -0.2);
      for (let i = 0; i < (big ? 12 : 9); i++) {
        const y = cy - i * 0.5 + flap * (i / 9);
        ctx.fillRect(cx + side * (r + i), Math.round(y), 1, Math.max(1, 5 - i * 0.35));
      }
    }
    mass(ctx, cx, cy, r, r - 1, pal);
    mass(ctx, cx, cy - r - 1, r - 2, r - 2, pal);
    P(ctx, cx - 2, cy - r - 2, pal.eye); P(ctx, cx + 2, cy - r - 2, pal.eye);
    lineTo(ctx, cx, cy - r, cx - 3, cy - r + 2, pal.accent, 1);
    R(ctx, cx - 2, cy + r - 1, 1, 4, pal.dark); R(ctx, cx + 1, cy + r - 1, 1, 4, pal.dark);
  }

  function drawFish(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, cy = 30, rx = s.big ? 12 : 9, ry = s.big ? 7 : 5;
    mass(ctx, cx, cy, rx, ry, pal);
    // cauda
    for (let i = 0; i < 6; i++) {
      const h = 1 + i;
      R(ctx, cx + rx + i, cy - h, 1, h * 2, i % 2 ? pal.main : pal.dark);
    }
    // barbatana
    for (let i = 0; i < 5; i++) R(ctx, cx - 2 + i, cy - ry - (5 - i) + 2, 1, 5 - i, pal.accent);
    P(ctx, cx - rx + 3, cy - 1, pal.eye);
    lineTo(ctx, cx - rx, cy + 1, cx - rx + 3, cy + 2, pal.dark, 1);
    if (s.glow) { ctx.globalAlpha = 0.4; ell(ctx, cx - rx - 2, cy - 4, 2, 2, pal.accent); ctx.globalAlpha = 1; }
  }

  function drawCrab(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, cy = 36;
    ell(ctx, cx, 45, 10, 2, 'rgba(0,0,0,0.25)');
    for (const side of [-1, 1]) for (let i = 0; i < 3; i++) lineTo(ctx, cx + side * 6, cy + 1 + i * 2, cx + side * 12, 44, pal.dark, 1);
    mass(ctx, cx, cy, 10, 6, pal);
    P(ctx, cx - 3, cy - 4, pal.eye); P(ctx, cx + 3, cy - 4, pal.eye);
    const up = pose === 'action' ? -4 : 0;
    for (const side of [-1, 1]) {
      lineTo(ctx, cx + side * 8, cy, cx + side * 13, cy - 4 + up, pal.main, 2);
      ell(ctx, cx + side * 14, cy - 6 + up, 3, 3, pal.light);
      R(ctx, cx + side * 14 - 1, cy - 6 + up, 3, 1, pal.dark);
    }
  }

  function drawBat(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, cy = 26;
    const flap = pose === 'action' ? 5 : 0;
    for (const side of [-1, 1]) {
      ctx.fillStyle = pal.main;
      for (let i = 0; i < 12; i++) {
        const y = cy - 3 + Math.round(Math.sin(i / 4) * 3) + Math.round((i / 12) * flap);
        ctx.fillRect(cx + side * (4 + i), y, 1, Math.max(1, 7 - Math.abs(i - 5)));
      }
      lineTo(ctx, cx + side * 4, cy - 3, cx + side * 15, cy - 6 + flap, pal.dark, 1);
    }
    mass(ctx, cx, cy, 4, 5, pal);
    P(ctx, cx - 2, cy - 2, pal.eye); P(ctx, cx + 2, cy - 2, pal.eye);
    lineTo(ctx, cx - 3, cy - 5, cx - 4, cy - 8, pal.dark, 1);
    lineTo(ctx, cx + 3, cy - 5, cx + 4, cy - 8, pal.dark, 1);
  }

  function drawBlob(ctx, s, pose, rnd) {
    const pal = s.pal || DEF_PAL;
    const cx = 24, feet = 45;
    ell(ctx, cx, feet + 1, 12, 2, 'rgba(0,0,0,0.28)');
    const squash = pose === 'action' ? 2 : 0;
    mass(ctx, cx, feet - 8 + squash, 11, 8 - squash, pal);
    for (let i = 0; i < 5; i++) P(ctx, cx - 8 + i * 4, feet - 15 + (i % 2) * 2, pal.light);
    P(ctx, cx - 3, feet - 10, pal.eye); P(ctx, cx + 3, feet - 10, pal.eye);
  }

  const ARCH = {
    humanoid: drawHumanoid, beast: drawBeast, serpent: drawSerpent, spirit: drawSpirit,
    plant: drawPlant, golem: drawGolem, insect: drawInsect, bird: drawBird,
    fish: drawFish, crab: drawCrab, bat: drawBat, blob: drawBlob
  };

  /* =========================================================
   * SPRITE
   * ======================================================= */
  art.sprite = function (spec, pose) {
    pose = pose || 'idle';
    const key = 'sp_' + JSON.stringify(spec) + '_' + pose;
    if (cache[key]) return cache[key];
    const size = spec.boss || spec.big ? 64 : 48;
    const c = mk(size, size);
    const ctx = c.getContext('2d');
    ctx.save();
    if (size === 64) ctx.translate(8, 12);   // centraliza o desenho de 48px
    const fn = ARCH[spec.arch] || drawHumanoid;
    const rnd = U.rng(hashStr(spec.arch + (spec.pal && spec.pal.main)));
    if (spec.boss || spec.big) { ctx.translate(24, 45); ctx.scale(1.35, 1.35); ctx.translate(-24, -45); }
    fn(ctx, spec, pose, rnd);
    ctx.restore();
    cache[key] = c;
    return c;
  };

  function hashStr(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* =========================================================
   * RETRATO
   * ======================================================= */
  /** Caixa envolvente do conteúdo não transparente de um canvas. */
  function bbox(cnv) {
    const x = cnv.getContext('2d');
    const d = x.getImageData(0, 0, cnv.width, cnv.height).data;
    let minX = cnv.width, minY = cnv.height, maxX = -1, maxY = -1;
    for (let i = 3; i < d.length; i += 4) {
      if (d[i] < 20) continue;
      const p = (i - 3) / 4, px = p % cnv.width, py = (p / cnv.width) | 0;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
    }
    if (maxX < 0) return { x: 0, y: 0, w: cnv.width, h: cnv.height };
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
  }
  art.bbox = bbox;

  art.portrait = function (spec, rarityColor) {
    const key = 'pt_' + JSON.stringify(spec) + (rarityColor || '');
    if (cache[key]) return cache[key];
    const c = mk(40, 40);
    const ctx = c.getContext('2d');
    // fundo
    const pal = spec.pal || DEF_PAL;
    const g = ctx.createLinearGradient(0, 0, 0, 40);
    g.addColorStop(0, U.shade(pal.dark, 0.25));
    g.addColorStop(1, U.shade(pal.dark, -0.4));
    ctx.fillStyle = g; ctx.fillRect(0, 0, 40, 40);
    // Recorte do busto: calculado a partir da caixa real do sprite, para
    // funcionar com qualquer arquétipo (humanoide, fera, serpente, planta…).
    const sp = art.sprite(spec, 'idle');
    const b = bbox(sp);
    const side = U.clamp(Math.max(b.w, b.h * 0.58), 16, Math.min(sp.width, sp.height));
    const cx = b.x + b.w / 2;
    const sx = U.clamp(Math.round(cx - side / 2), 0, sp.width - side);
    const sy = U.clamp(Math.round(b.y - 1), 0, sp.height - side);
    ctx.save();
    ctx.beginPath(); ctx.rect(2, 2, 36, 36); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sp, sx, sy, side, side, 2, 2, 36, 36);
    ctx.restore();
    // moldura
    ctx.strokeStyle = rarityColor || '#c9a227';
    ctx.lineWidth = 2; ctx.strokeRect(1, 1, 38, 38);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, 39, 39);
    cache[key] = c;
    return c;
  };

  /* =========================================================
   * ÍCONES (equipamento, materiais, moedas)
   * ======================================================= */
  art.icon = function (kind, color) {
    const key = 'ic_' + kind + '_' + color;
    if (cache[key]) return cache[key];
    const c = mk(16, 16);
    const ctx = c.getContext('2d');
    const col = color || '#c9c9d2';
    const d = U.shade(col, -0.45), l = U.shade(col, 0.4);
    switch (kind) {
      case 'sword': lineTo(ctx, 4, 12, 11, 4, col, 2); R(ctx, 3, 11, 4, 2, d); lineTo(ctx, 5, 12, 10, 5, l, 1); break;
      case 'helm': ell(ctx, 8, 8, 5, 5, d); ell(ctx, 8, 8, 4, 4, col); R(ctx, 6, 7, 4, 4, d); R(ctx, 5, 4, 6, 2, l); break;
      case 'chest': R(ctx, 4, 4, 8, 9, d); R(ctx, 5, 5, 6, 7, col); R(ctx, 5, 5, 3, 4, l); R(ctx, 3, 4, 2, 3, d); R(ctx, 11, 4, 2, 3, d); break;
      case 'glove': R(ctx, 5, 6, 6, 7, d); R(ctx, 6, 7, 4, 5, col); R(ctx, 4, 5, 2, 3, col); R(ctx, 10, 5, 2, 3, col); break;
      case 'boot': R(ctx, 5, 3, 4, 8, d); R(ctx, 6, 4, 2, 6, col); R(ctx, 4, 10, 8, 3, d); R(ctx, 5, 11, 6, 1, l); break;
      case 'amulet': for (let i = 0; i < 10; i++) { const a2 = Math.PI + (i / 9) * Math.PI; P(ctx, 8 + Math.cos(a2) * 5, 7 + Math.sin(a2) * 4, d); } ell(ctx, 8, 11, 3, 3, col); ell(ctx, 7, 10, 1, 1, l); break;
      case 'ring': ell(ctx, 8, 9, 4, 4, d); ell(ctx, 8, 9, 2, 2, '#00000000'); ctx.fillStyle = 'rgba(0,0,0,0)'; ell(ctx, 8, 9, 3, 3, col); ell(ctx, 8, 9, 2, 2, '#0000'); R(ctx, 6, 8, 5, 3, col); ell(ctx, 8, 4, 2, 2, l); break;
      case 'relic': for (let i = 0; i < 6; i++) { const a2 = (i / 6) * Math.PI * 2; lineTo(ctx, 8, 8, 8 + Math.cos(a2) * 6, 8 + Math.sin(a2) * 6, d, 1); } ell(ctx, 8, 8, 3, 3, col); ell(ctx, 7, 7, 1, 1, l); break;
      case 'gold': ell(ctx, 8, 8, 5, 5, U.shade('#ffd94a', -0.35)); ell(ctx, 8, 8, 4, 4, '#ffd94a'); ell(ctx, 6, 6, 1, 1, '#fff8c0'); break;
      case 'gem': for (let y = 0; y < 6; y++) R(ctx, 8 - (5 - y), 4 + y, (5 - y) * 2 + 1, 1, '#7fe8ff'); for (let y = 0; y < 5; y++) R(ctx, 8 - y, 10 + y, y * 2 + 1, 1, '#3fa8d8'); break;
      case 'essence': ell(ctx, 8, 8, 5, 6, '#5a2a7a'); ell(ctx, 8, 8, 3, 4, '#c07bff'); ell(ctx, 7, 6, 1, 1, '#fff'); break;
      case 'token': ell(ctx, 8, 8, 6, 6, '#8a5a2a'); ell(ctx, 8, 8, 4, 4, '#d99a4a'); R(ctx, 6, 7, 5, 3, '#5a3a18'); break;
      case 'mat': ell(ctx, 8, 9, 5, 4, d); ell(ctx, 7, 8, 3, 3, col); ell(ctx, 10, 10, 2, 2, l); break;
      case 'potion': R(ctx, 7, 2, 3, 3, d); ell(ctx, 8, 10, 4, 5, d); ell(ctx, 8, 10, 3, 4, col); ell(ctx, 7, 9, 1, 1, l); break;
      case 'star': for (let i = 0; i < 5; i++) { const a2 = -Math.PI / 2 + (i / 5) * Math.PI * 2; lineTo(ctx, 8, 8, 8 + Math.cos(a2) * 6, 8 + Math.sin(a2) * 6, col, 2); } ell(ctx, 8, 8, 2, 2, l); break;
      case 'lock': R(ctx, 4, 8, 8, 6, col); R(ctx, 6, 4, 4, 4, d); R(ctx, 7, 10, 2, 2, d); break;
      default: ell(ctx, 8, 8, 5, 5, col); break;
    }
    cache[key] = c;
    return c;
  };

  /* =========================================================
   * CENÁRIO
   * ======================================================= */
  /* --------------------------------------------------------------
   * Silhuetas de primeiro plano. Cada região escolhe um tipo em
   * `pal.prop`, para que dez regiões não pareçam a mesma paisagem
   * repintada.
   * ------------------------------------------------------------ */
  function drawProp(ctx, kind, x, baseY, rnd, pal) {
    const col = pal.near, dark = U.shade(pal.near, -0.3), lit = U.shade(pal.near, 0.18);
    switch (kind) {
      case 'tree': {                    // copa arredondada
        const th = 14 + rnd() * 20;
        ctx.fillStyle = dark; ctx.fillRect(x, baseY - th, 2, th);
        ell(ctx, x + 1, baseY - th, 5 + rnd() * 3, 4 + rnd() * 3, col);
        break;
      }
      case 'palm': {                    // tronco curvo + folhas
        const th = 18 + rnd() * 16;
        for (let y = 0; y < th; y++) ctx.fillRect(x + Math.round(Math.sin(y / th * 1.2) * 3), baseY - y, 2, 1);
        const tx = x + Math.round(Math.sin(1.2) * 3);
        for (let f = 0; f < 5; f++) {
          const a = -Math.PI + f * (Math.PI / 4);
          lineTo(ctx, tx + 1, baseY - th, tx + 1 + Math.cos(a) * 9, baseY - th + Math.sin(a) * 5 + 2, col, 2);
        }
        break;
      }
      case 'cactus': {                  // mandacaru: coluna com braços
        const th = 12 + rnd() * 16;
        ctx.fillStyle = col; ctx.fillRect(x, baseY - th, 3, th);
        ctx.fillStyle = lit; ctx.fillRect(x, baseY - th, 1, th);
        if (rnd() > 0.35) { ctx.fillStyle = col; ctx.fillRect(x - 3, baseY - th * 0.7, 3, 2); ctx.fillRect(x - 3, baseY - th * 0.7 - 5, 2, 6); }
        if (rnd() > 0.45) { ctx.fillStyle = col; ctx.fillRect(x + 3, baseY - th * 0.55, 3, 2); ctx.fillRect(x + 4, baseY - th * 0.55 - 6, 2, 7); }
        break;
      }
      case 'thin': {                    // árvore retorcida do cerrado
        const th = 12 + rnd() * 14;
        let cx = x;
        for (let y = 0; y < th; y++) { cx += (rnd() - 0.5) * 0.9; ctx.fillStyle = dark; ctx.fillRect(Math.round(cx), baseY - y, 2, 1); }
        for (let b = 0; b < 3; b++) lineTo(ctx, cx, baseY - th, cx + (b - 1) * 6, baseY - th - 3 - rnd() * 4, dark, 1);
        ell(ctx, cx, baseY - th - 2, 4 + rnd() * 2, 2, col);
        break;
      }
      case 'deadtree': {                // galhos secos do pântano
        const th = 14 + rnd() * 18;
        ctx.fillStyle = dark; ctx.fillRect(x, baseY - th, 2, th);
        for (let b = 0; b < 4; b++) {
          const by = baseY - th * (0.5 + b * 0.14), dir = b % 2 ? 1 : -1;
          lineTo(ctx, x + 1, by, x + 1 + dir * (4 + rnd() * 5), by - 4 - rnd() * 4, dark, 1);
        }
        break;
      }
      case 'root': {                    // raízes de mangue em arco
        const th = 8 + rnd() * 10;
        ctx.fillStyle = dark; ctx.fillRect(x, baseY - th - 6, 2, th);
        for (let r = -2; r <= 2; r++) {
          if (!r) continue;
          for (let s = 0; s <= 8; s++) {
            const t = s / 8;
            ctx.fillRect(Math.round(x + r * 4 * t), Math.round(baseY - th * (1 - t * t)), 1, 1);
          }
        }
        ell(ctx, x + 1, baseY - th - 6, 5 + rnd() * 3, 3, col);
        break;
      }
      case 'crystal': {                 // agulhas de cristal
        const th = 8 + rnd() * 20;
        for (let s = 0; s < th; s++) {
          const wdt = Math.max(1, Math.round((1 - s / th) * 4));
          ctx.fillStyle = s % 3 ? col : lit;
          ctx.fillRect(x - (wdt >> 1), baseY - s, wdt, 1);
        }
        break;
      }
      case 'house': {                    // casinhas do vilarejo
        const bw = 12 + rnd() * 8, bh = 9 + rnd() * 6;
        ctx.fillStyle = col; ctx.fillRect(x, baseY - bh, bw, bh);
        ctx.fillStyle = dark;
        for (let s = 0; s <= bw / 2; s++) ctx.fillRect(x + s, baseY - bh - Math.round(s * 0.7), bw - s * 2, 1);
        ctx.fillStyle = U.shade(pal.accent, -0.2);
        ctx.fillRect(x + Math.round(bw / 2) - 1, baseY - 4, 3, 4);
        break;
      }
      case 'flag': {                     // mastros e bandeirinhas da festa
        const th = 16 + rnd() * 14;
        ctx.fillStyle = dark; ctx.fillRect(x, baseY - th, 1, th);
        for (let f = 0; f < 4; f++) {
          ctx.fillStyle = f % 2 ? pal.accent : col;
          const fy = baseY - th + 2 + f * 4;
          for (let s = 0; s < 4; s++) ctx.fillRect(x + 1 + s, fy + s, 1, 4 - s);
        }
        break;
      }
      case 'ruin': {                     // colunas partidas
        const th = 12 + rnd() * 20, bw = 4 + Math.round(rnd() * 2);
        ctx.fillStyle = col; ctx.fillRect(x, baseY - th, bw, th);
        ctx.fillStyle = lit; ctx.fillRect(x, baseY - th, 1, th);
        ctx.fillStyle = dark;
        for (let s = 0; s < th; s += 5) ctx.fillRect(x, baseY - s, bw, 1);
        ctx.fillRect(x - 1, baseY - th - 2, bw + 2, 2);
        break;
      }
      default: {
        const th = 14 + rnd() * 18;
        ctx.fillStyle = dark; ctx.fillRect(x, baseY - th, 2, th);
        ell(ctx, x + 1, baseY - th, 5, 4, col);
      }
    }
  }

  art.background = function (pal, w, h, weather) {
    const key = 'bg_' + pal.skyTop + pal.ground + pal.near + (pal.prop || '') + w + 'x' + h + weather;
    if (cache[key]) return cache[key];
    const c = mk(w, h);
    const ctx = c.getContext('2d');
    const rnd = U.rng(hashStr(pal.skyTop + pal.ground));

    // céu
    const g = ctx.createLinearGradient(0, 0, 0, h * 0.75);
    g.addColorStop(0, pal.skyTop); g.addColorStop(1, pal.skyBot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    // astro
    const sunX = w * (0.18 + rnd() * 0.6), sunY = h * 0.16;
    ctx.globalAlpha = 0.35; ell(ctx, sunX, sunY, 16, 16, pal.sun); ctx.globalAlpha = 1;
    ell(ctx, sunX, sunY, 8, 8, pal.sun);
    if (weather === 'eclipse') { ell(ctx, sunX - 3, sunY - 2, 8, 8, U.shade(pal.skyTop, -0.4)); }

    // camadas distantes
    function ridge(baseY, amp, col, step, jag) {
      ctx.fillStyle = col;
      let prev = baseY;
      for (let x = 0; x < w; x += step) {
        const n = Math.sin(x * 0.021 + rnd() * 0.4) * amp + Math.sin(x * 0.061) * amp * 0.4;
        const y = Math.round(baseY + n - (jag ? rnd() * amp * 0.5 : 0));
        ctx.fillRect(x, y, step, h - y);
        prev = y;
      }
    }
    ridge(h * 0.55, 10, U.shade(pal.far, 0.05), 3, false);
    ridge(h * 0.66, 8, pal.mid, 2, true);

    // vegetação/estruturas próprias da região
    const groundY = h * 0.72;
    const prop = pal.prop || 'tree';
    const count = prop === 'house' || prop === 'ruin' ? 7 : 14;
    for (let i = 0; i < count; i++) {
      const x = Math.round(rnd() * w);
      drawProp(ctx, prop, x, groundY, rnd, pal);
    }

    // chão
    ctx.fillStyle = pal.ground;
    ctx.fillRect(0, Math.round(h * 0.72), w, h);
    ctx.fillStyle = pal.groundDark;
    for (let i = 0; i < w * 1.2; i++) {
      const x = rnd() * w, y = h * 0.72 + rnd() * (h * 0.28);
      ctx.fillRect(x | 0, y | 0, 1 + (rnd() > 0.8 ? 1 : 0), 1);
    }
    // linha do horizonte
    ctx.fillStyle = U.shade(pal.ground, -0.3);
    ctx.fillRect(0, Math.round(h * 0.72), w, 1);

    // névoa
    ctx.globalAlpha = 0.16; ctx.fillStyle = pal.fog;
    ctx.fillRect(0, Math.round(h * 0.6), w, Math.round(h * 0.18));
    ctx.globalAlpha = 1;

    cache[key] = c;
    return c;
  };

  /* =========================================================
   * LOGOTIPO
   * ======================================================= */
  art.logo = function (w, h) {
    w = w || 320; h = h || 128;
    const key = 'logo' + w + 'x' + h;
    if (cache[key]) return cache[key];
    const S = 2;                     // fator de pixelização
    const c = mk(w, h);
    const ctx = c.getContext('2d');
    const lc = mk(Math.round(w / S), Math.round(h / S));
    const x = lc.getContext('2d');
    const W = lc.width, H = lc.height;

    // fundo: ruínas
    x.fillStyle = 'rgba(0,0,0,0)'; x.clearRect(0, 0, W, H);
    x.globalAlpha = 0.5;
    for (let i = 0; i < 6; i++) {
      const cx = 10 + i * (W - 20) / 5, ch = 16 + (i % 3) * 6;
      x.fillStyle = '#3a2f52'; x.fillRect(cx - 2, H * 0.5 - ch, 5, ch);
      x.fillStyle = '#4a3f66'; x.fillRect(cx - 4, H * 0.5 - ch - 2, 9, 3);
    }
    x.globalAlpha = 1;

    // floresta à esquerda
    for (let i = 0; i < 7; i++) {
      const tx = 4 + i * 5, th = 12 + (i % 3) * 5;
      x.fillStyle = '#14331f'; x.fillRect(tx, H * 0.52 - th, 2, th);
      ell(x, tx + 1, H * 0.52 - th, 4, 4, '#1e5c34');
    }
    // rio e cachoeira à direita
    x.fillStyle = '#1e4a7a';
    for (let y = 0; y < 20; y++) x.fillRect(W - 22 + Math.round(Math.sin(y / 4) * 2), H * 0.33 + y, 10, 1);
    x.fillStyle = '#7fd8ff';
    for (let y = 0; y < 18; y++) x.fillRect(W - 20 + Math.round(Math.sin(y / 4) * 2), H * 0.33 + y, 4, 1);
    ell(x, W - 16, H * 0.53, 8, 3, '#a8e8ff');

    // cristal central (silhueta livre inspirada em um mapa)
    const gx = W / 2, gy = H * 0.42;
    const shape = [
      [0, -20], [7, -17], [11, -9], [14, -1], [11, 8], [5, 15], [-3, 17], [-10, 11], [-13, 2], [-11, -8], [-5, -16]
    ];
    x.beginPath();
    shape.forEach((p, i) => { const px = gx + p[0] * 1.15, py = gy + p[1] * 1.15; i ? x.lineTo(px, py) : x.moveTo(px, py); });
    x.closePath();
    const cg = x.createLinearGradient(gx - 14, gy - 20, gx + 14, gy + 18);
    cg.addColorStop(0, '#8affd8'); cg.addColorStop(0.45, '#2ec98f'); cg.addColorStop(1, '#0f6b4a');
    x.fillStyle = cg; x.fill();
    x.strokeStyle = '#eaffe0'; x.lineWidth = 1; x.stroke();
    // facetas
    x.strokeStyle = 'rgba(255,255,255,0.4)';
    x.beginPath(); x.moveTo(gx - 6, gy - 18); x.lineTo(gx + 2, gy + 4); x.lineTo(gx + 12, gy - 4); x.stroke();

    // serpente de fogo em volta
    for (let i = 0; i < 90; i++) {
      const t = i / 90, a2 = t * Math.PI * 2.6 - 0.6;
      const rr = 20 + Math.sin(t * 6) * 3;
      const px = gx + Math.cos(a2) * rr * 1.25, py = gy + Math.sin(a2) * rr * 0.85;
      const col = i % 7 < 3 ? '#ff8a2a' : (i % 7 < 5 ? '#ffd24a' : '#c4351a');
      x.fillStyle = col; x.fillRect(px | 0, py | 0, 2, 2);
    }
    // cabeça da serpente
    ell(x, gx + Math.cos(-0.6) * 25, gy + Math.sin(-0.6) * 17, 3, 3, '#ffd24a');
    // redemoinho
    for (let i = 0; i < 26; i++) {
      const a2 = i * 0.55, rr = 1.5 + i * 0.42;
      x.fillStyle = i % 2 ? '#cfeaff' : '#8fc8ff';
      x.fillRect((gx - 32 + Math.cos(a2) * rr) | 0, (gy + 16 + Math.sin(a2) * rr * 0.6) | 0, 1, 1);
    }

    // amplia (nearest neighbour) para o canvas final
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lc, 0, 0, W, H, 0, 0, w, h);

    cache[key] = c;
    return c;
  };

  /** Texto em estilo pixel: desenha pequeno e amplia. */
  art.pixelText = function (text, px, color, outline) {
    const key = 'tx_' + text + px + color + outline;
    if (cache[key]) return cache[key];
    const S = 3;
    const small = mk(4, 4);
    const sx = small.getContext('2d');
    sx.font = 'bold ' + Math.round(px / S) + 'px "Courier New", monospace';
    const wsm = Math.ceil(sx.measureText(text).width) + 4;
    const hsm = Math.round(px / S) + 6;
    const c2 = mk(wsm, hsm);
    const x2 = c2.getContext('2d');
    x2.font = 'bold ' + Math.round(px / S) + 'px "Courier New", monospace';
    x2.textBaseline = 'middle';
    if (outline) {
      x2.strokeStyle = outline; x2.lineWidth = 2;
      x2.strokeText(text, 2, hsm / 2);
    }
    x2.fillStyle = color; x2.fillText(text, 2, hsm / 2);
    const out = mk(wsm * S, hsm * S);
    const o = out.getContext('2d');
    o.imageSmoothingEnabled = false;
    o.drawImage(c2, 0, 0, wsm, hsm, 0, 0, wsm * S, hsm * S);
    cache[key] = out;
    return out;
  };

  art.clearCache = function () { for (const k in cache) delete cache[k]; };
})();


/* ======== src/audio.js ======== */
/* =============================================================
 * audio.js — som 100% procedural (Web Audio API).
 * Nenhum arquivo externo: efeitos e trilha são sintetizados.
 * Três barramentos de volume: música, efeitos e interface.
 * ============================================================= */
(function () {
  'use strict';
  const G = (window.LDB = window.LDB || {});
  const A = (G.audio = {});

  let ctx = null, master = null, busMusic = null, busSfx = null, busUi = null;
  let started = false, muted = false;
  let musicTimer = null, musicState = null;

  A.volumes = { music: 0.45, sfx: 0.6, ui: 0.5 };

  /** Inicializa no primeiro gesto do usuário (política de autoplay). */
  A.init = function () {
    if (started) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
      busMusic = ctx.createGain(); busMusic.gain.value = A.volumes.music; busMusic.connect(master);
      busSfx = ctx.createGain(); busSfx.gain.value = A.volumes.sfx; busSfx.connect(master);
      busUi = ctx.createGain(); busUi.gain.value = A.volumes.ui; busUi.connect(master);
      started = true;
      return true;
    } catch (e) { console.warn('[LDB] áudio indisponível', e); return false; }
  };

  A.resume = function () { if (ctx && ctx.state === 'suspended') ctx.resume(); };
  A.setVolume = function (bus, v) {
    A.volumes[bus] = v;
    if (!started) return;
    const g = bus === 'music' ? busMusic : bus === 'sfx' ? busSfx : busUi;
    g.gain.setTargetAtTime(v, ctx.currentTime, 0.02);
  };
  A.setMuted = function (m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.02); };
  A.isMuted = function () { return muted; };

  /* ---------------- síntese básica ---------------- */
  function tone(bus, opt) {
    if (!started || muted) return;
    const t0 = ctx.currentTime + (opt.delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = opt.type || 'square';
    o.frequency.setValueAtTime(opt.f0, t0);
    if (opt.f1 !== undefined) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.f1), t0 + opt.dur);
    const vol = (opt.vol === undefined ? 0.25 : opt.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (opt.attack || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);
    o.connect(g);
    if (opt.filter) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opt.filter;
      g.connect(f); f.connect(bus);
    } else g.connect(bus);
    o.start(t0); o.stop(t0 + opt.dur + 0.05);
  }

  function noise(bus, dur, vol, freq, delay) {
    if (!started || muted) return;
    const t0 = ctx.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.9;
    const g = ctx.createGain(); g.gain.value = vol === undefined ? 0.22 : vol;
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0); src.stop(t0 + dur);
  }

  /* ---------------- efeitos do jogo ---------------- */
  const SFX = {
    hit: () => { noise(busSfx, 0.09, 0.22, 900); tone(busSfx, { f0: 220, f1: 90, dur: 0.1, type: 'square', vol: 0.16 }); },
    hitHeavy: () => { noise(busSfx, 0.16, 0.3, 500); tone(busSfx, { f0: 150, f1: 55, dur: 0.18, type: 'sawtooth', vol: 0.2 }); },
    crit: () => { tone(busSfx, { f0: 900, f1: 1800, dur: 0.09, type: 'square', vol: 0.22 }); tone(busSfx, { f0: 1400, f1: 300, dur: 0.16, type: 'square', vol: 0.16, delay: 0.05 }); noise(busSfx, 0.12, 0.2, 2200); },
    arrow: () => { noise(busSfx, 0.07, 0.16, 2600); tone(busSfx, { f0: 1200, f1: 500, dur: 0.09, type: 'triangle', vol: 0.12 }); },
    magic: () => { tone(busSfx, { f0: 420, f1: 1200, dur: 0.24, type: 'triangle', vol: 0.18 }); tone(busSfx, { f0: 640, f1: 1600, dur: 0.2, type: 'sine', vol: 0.12, delay: 0.04 }); },
    fire: () => { noise(busSfx, 0.3, 0.2, 700); tone(busSfx, { f0: 180, f1: 60, dur: 0.3, type: 'sawtooth', vol: 0.14 }); },
    heal: () => { [523, 659, 784].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.22, type: 'sine', vol: 0.16, delay: i * 0.06 })); },
    shield: () => { tone(busSfx, { f0: 300, f1: 700, dur: 0.25, type: 'triangle', vol: 0.16 }); noise(busSfx, 0.12, 0.1, 400); },
    buff: () => { [392, 523, 659].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.16, type: 'square', vol: 0.1, delay: i * 0.05 })); },
    debuff: () => { tone(busSfx, { f0: 400, f1: 120, dur: 0.28, type: 'sawtooth', vol: 0.14 }); },
    stun: () => { tone(busSfx, { f0: 1200, f1: 200, dur: 0.2, type: 'square', vol: 0.16 }); noise(busSfx, 0.2, 0.16, 1600); },
    die: () => { tone(busSfx, { f0: 320, f1: 60, dur: 0.4, type: 'sawtooth', vol: 0.2 }); noise(busSfx, 0.25, 0.14, 300); },
    ultimate: () => {
      [220, 330, 440, 660].forEach((f, i) => tone(busSfx, { f0: f, f1: f * 2, dur: 0.4, type: 'sawtooth', vol: 0.14, delay: i * 0.05 }));
      noise(busSfx, 0.5, 0.2, 900, 0.1);
    },
    boss: () => {
      [110, 87, 110, 65].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.5, type: 'sawtooth', vol: 0.24, delay: i * 0.22, filter: 900 }));
      noise(busSfx, 0.9, 0.16, 200, 0.1);
    },
    victory: () => { [523, 659, 784, 1047].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.32, type: 'square', vol: 0.18, delay: i * 0.13 })); },
    defeat: () => { [392, 349, 294, 220].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.4, type: 'triangle', vol: 0.18, delay: i * 0.18 })); },
    levelup: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.2, type: 'square', vol: 0.16, delay: i * 0.07 })); },
    loot: () => { [880, 1174].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.16, type: 'square', vol: 0.14, delay: i * 0.07 })); },
    click: () => tone(busUi, { f0: 640, f1: 880, dur: 0.05, type: 'square', vol: 0.16 }),
    back: () => tone(busUi, { f0: 500, f1: 300, dur: 0.07, type: 'square', vol: 0.14 }),
    error: () => tone(busUi, { f0: 200, f1: 120, dur: 0.16, type: 'square', vol: 0.16 }),
    tab: () => tone(busUi, { f0: 760, dur: 0.05, type: 'triangle', vol: 0.14 }),
    coin: () => { [1046, 1568].forEach((f, i) => tone(busUi, { f0: f, dur: 0.1, type: 'square', vol: 0.12, delay: i * 0.05 })); },
    craft: () => { noise(busSfx, 0.12, 0.2, 1400); tone(busSfx, { f0: 300, f1: 900, dur: 0.2, type: 'triangle', vol: 0.14, delay: 0.06 }); },
    secret: () => { [659, 784, 1047, 1319, 1568].forEach((f, i) => tone(busSfx, { f0: f, dur: 0.24, type: 'sine', vol: 0.16, delay: i * 0.09 })); }
  };

  A.play = function (name) {
    if (!started || muted) return;
    const fn = SFX[name];
    if (fn) { try { fn(); } catch (e) { /* silencioso */ } }
  };

  /* ---------------- trilha procedural por região ---------------- */
  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11],
    dorian: [0, 2, 3, 5, 7, 9, 10],
    phrygian: [0, 1, 3, 5, 7, 8, 10],
    lydian: [0, 2, 4, 6, 7, 9, 11],
    mixolydian: [0, 2, 4, 5, 7, 9, 10],
    aeolian: [0, 2, 3, 5, 7, 8, 10]
  };
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);

  /** Toca a trilha de uma região. cfg = {scale, root, tempo, mood} */
  A.playMusic = function (cfg) {
    if (!started) return;
    A.stopMusic();
    if (!cfg) return;
    const scale = SCALES[cfg.scale] || SCALES.major;
    const beat = 60 / (cfg.tempo || 100) / 2;
    let step = 0;
    musicState = cfg;
    const arp = [0, 2, 4, 6, 4, 2];
    musicTimer = setInterval(function () {
      if (muted || !started) return;
      const bar = Math.floor(step / 8);
      // baixo
      if (step % 4 === 0) {
        const root = cfg.root - 12 + scale[(bar * 2) % scale.length];
        tone(busMusic, { f0: midi(root), dur: beat * 3.2, type: 'triangle', vol: 0.15, filter: 600 });
      }
