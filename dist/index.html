    const lv = Game.prestigeLevel(up.id);
    return Math.floor(up.base * Math.pow(up.growth, lv));
  };
  Game.buyPrestige = function (id) {
    const s = Game.state;
    const up = B.prestige.upgrades.find((u) => u.id === id);
    if (!up) return false;
    const lv = Game.prestigeLevel(id);
    if (lv >= up.max) return false;
    const cost = Game.prestigeCost(up);
    if (s.essence < cost) { G.audio.play('error'); return false; }
    s.essence -= cost;
    s.prestigeUpgrades[id] = lv + 1;
    G.audio.play('levelup');
    Game.events.emit('resources'); Game.events.emit('prestige');
    Game.requestSave();                   // compra com essência
    return true;
  };

  Game.idleCost = function (up) {
    const lv = Game.idleLevel(up.id);
    return Math.floor(up.base * Math.pow(up.growth, lv));
  };
  Game.buyIdle = function (id) {
    const s = Game.state;
    const up = B.idle.upgrades.find((u) => u.id === id);
    if (!up) return false;
    const lv = Game.idleLevel(id);
    if (lv >= up.max) return false;
    const cost = Game.idleCost(up);
    if (s.gold < cost) { G.audio.play('error'); return false; }
    s.gold -= cost;
    s.idleUpgrades[id] = lv + 1;
    G.audio.play('levelup');
    Game.events.emit('resources'); Game.events.emit('idle');
    Game.requestSave();                   // melhoria de ociosidade
    return true;
  };

  /* ==========================================================
   * LOOP
   * ======================================================== */
  Game.update = function (dt) {
    const s = Game.state;
    if (!s) return;
    s.playTime += dt;
    Game.checkResets();

    if (Game.battle && !Game.battle.over) {
      const speed = Game.settings.battleSpeed * Game.globalMods().battleSpeed;
      G.combat.update(Game.battle, dt * speed);
      if (Game.battle.over) handleBattleEnd();
    } else if (Game.session.resultTimer > 0) {
      Game.session.resultTimer -= dt;
      if (Game.session.resultTimer <= 0) advanceAfterBattle();
    }
    G.idle.update(dt);
  };

  function handleBattleEnd() {
    const b = Game.battle;
    const s = Game.state;
    if (b.result === 'victory') {
      const gained = Game.grantVictory(s.stage);
      Game.session.lastResult = { result: 'victory', gained: gained, stage: s.stage };
    } else {
      Game.session.lastResult = { result: 'defeat', stage: s.stage };
    }
    Game.session.resultTimer = 1.6;
    Game.events.emit('battleEnd', Game.session.lastResult);
  }

  function advanceAfterBattle() {
    const s = Game.state;
    const r = Game.session.lastResult;
    if (!r) return;
    if (r.result === 'victory') {
      Game.session.losses = 0;
      if (!Game.settings.repeatStage && Game.settings.autoProgress) s.stage = Math.min(s.maxStage, s.stage + 1);
      Game.startBattle(s.stage);
    } else {
      // Recuo automático: sem isso o grupo ficaria preso para sempre num
      // estágio que não consegue vencer, já que derrotas não dão recompensa.
      Game.session.losses = (Game.session.losses || 0) + 1;
      if (Game.session.losses >= 3 && s.stage > 0 && !Game.settings.repeatStage) {
        Game.session.losses = 0;
        s.stage = Math.max(0, s.stage - 1);
        Game.events.emit('toast', { text: G.t('autoRetreat', { n: s.stage + 1 }), kind: 'warn' });
      }
      if (Game.settings.autoProgress) Game.startBattle(s.stage);
      else Game.battle = null;
    }
    Game.events.emit('battleReset');
  }

  Game.setStage = function (idx) {
    const s = Game.state;
    s.stage = U.clamp(idx, 0, Math.max(0, s.maxStage));
    Game.startBattle(s.stage);
    Game.events.emit('stage');
  };

  Game.restartBattle = function () { Game.startBattle(Game.state.stage); };

  /* ==========================================================
   * SALVAR
   * ======================================================== */
  Game.serialize = function () {
    const s = Game.state;
    s.lastSeen = Date.now();
    return s;
  };
  let lastSaveWarn = 0;
  let saveDebounce = null;

  Game.saveNow = function () {
    if (!Game.state) return false;
    if (saveDebounce) { clearTimeout(saveDebounce); saveDebounce = null; }
    const ok = G.save.write(Game.serialize());
    G.save.saveSettings(Game.settings);
    if (ok) {
      Game.events.emit('saved');
    } else {
      // Falha silenciosa é o pior caso possível: o jogador segue jogando
      // achando que está tudo salvo. Avisa, no máximo uma vez por minuto.
      const now = Date.now();
      if (now - lastSaveWarn > 60000) {
        lastSaveWarn = now;
        Game.events.emit('saveError', G.save.lastError || 'blocked');
      }
    }
    return ok;
  };

  /**
   * Pede uma gravação logo após um marco importante (novo estágio recorde,
   * chefe derrotado, compra, renascimento). Agrupa rajadas de eventos numa
   * gravação só, para não escrever no localStorage a cada quadro.
   */
  Game.requestSave = function () {
    if (saveDebounce || !Game.state) return;
    saveDebounce = setTimeout(function () {
      saveDebounce = null;
      Game.saveNow();
    }, 1500);
  };
})();


/* ======== src/render.js ======== */
/* =============================================================
 * render.js — desenho da cena de batalha em Canvas 2D.
 * Resolução lógica fixa (480x270) escalada para o tamanho real,
 * mantendo o visual pixelado. Números de dano e partículas usam
 * pools de objetos para evitar alocação por quadro.
 * ============================================================= */
(function () {
  'use strict';
  const G = (window.LDB = window.LDB || {});
  const U = G.util;
  const R = (G.render = {});

  const VW = 480, VH = 270;              // resolução lógica da cena
  let canvas = null, ctx = null, scale = 1, dpr = 1;
  let shake = 0, shakeT = 0;
  let time = 0;

  const numbers = [];      // números flutuantes ativos
  const parts = [];        // partículas ativas
  const numPool = U.Pool(() => ({}), (o) => { o.dead = true; });
  const partPool = U.Pool(() => ({}), (o) => { o.dead = true; });

  R.attach = function (cnv) {
    canvas = cnv;
    ctx = canvas.getContext('2d', { alpha: false });
    R.resize();
  };

  R.resize = function () {
    if (!canvas) return;
    const q = G.game.settings.graphics;
    const maxDpr = q === 'low' ? 1 : q === 'medium' ? 1.5 : 2;
    dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(320, Math.round(rect.width));
    const h = Math.max(180, Math.round(rect.height));
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = Math.min(canvas.width / VW, canvas.height / VH);
    ctx.imageSmoothingEnabled = false;
  };

  /* ---------------- posições ---------------- */
  function slotPos(unit, total) {
    const isParty = unit.side === 'party';
    const i = unit.slotIndex;
    const baseX = isParty ? 116 : 366;
    const dir = isParty ? -1 : 1;
    const col = i % 2, row = Math.floor(i / 2);
    return {
      x: baseX + dir * col * 46 + dir * row * 8,
      y: 202 + row * 24 + (i % 2) * 9
    };
  }

  /* ---------------- efeitos ---------------- */
  function spawnNumber(x, y, text, color, big) {
    if (!G.game.settings.damageNumbers) return;
    if (numbers.length > 40) return;
    const n = numPool.get();
    n.x = x; n.y = y; n.text = text; n.color = color;
    n.vy = -26 - Math.random() * 10; n.vx = (Math.random() - 0.5) * 16;
    n.life = 1.0; n.big = !!big; n.dead = false;
    numbers.push(n);
  }

  function spawnPart(x, y, color, opt) {
    const q = G.game.settings.graphics;
    const cap = q === 'low' ? 60 : q === 'medium' ? 140 : 260;
    if (parts.length > cap) return;
    const p = partPool.get();
    opt = opt || {};
    p.x = x; p.y = y; p.color = color;
    p.vx = opt.vx !== undefined ? opt.vx : (Math.random() - 0.5) * 60;
    p.vy = opt.vy !== undefined ? opt.vy : -Math.random() * 50;
    p.g = opt.g === undefined ? 90 : opt.g;
    p.life = opt.life || 0.6; p.max = p.life;
    p.size = opt.size || 2; p.dead = false;
    parts.push(p);
  }

  function burst(x, y, color, n, opt) {
    const q = G.game.settings.graphics;
    const mult = q === 'low' ? 0.35 : q === 'medium' ? 0.65 : 1;
    n = Math.max(2, Math.round(n * mult));
    for (let i = 0; i < n; i++) spawnPart(x, y, color, opt);
  }

  R.shake = function (amount) {
    if (!G.game.settings.screenShake || G.game.settings.reducedMotion) return;
    shake = Math.max(shake, amount); shakeT = 0.25;
  };

  /* ---------------- consumo de eventos do combate ---------------- */
  R.consume = function (battle) {
    if (!battle) return;
    const fx = battle.fx;
    while (fx.length) {
      const e = fx.shift();
      const u = e.unit;
      const p = u ? slotPos(u) : { x: VW / 2, y: VH / 2 };
      switch (e.type) {
        case 'dmg':
          spawnNumber(p.x, p.y - 34, '-' + U.fmt(e.value), e.dmgType === 'mag' ? '#c79bff' : '#ffd9a0');
          burst(p.x, p.y - 22, e.dmgType === 'mag' ? '#c79bff' : '#ffb37a', 5, { life: 0.35 });
          break;
        case 'crit':
          spawnNumber(p.x, p.y - 38, U.fmt(e.value) + '!', '#ffef7a', true);
          burst(p.x, p.y - 22, '#fff0a0', 12, { life: 0.5, size: 3 });
          R.shake(3);
          break;
        case 'dot':
          spawnNumber(p.x + 10, p.y - 30, '-' + U.fmt(e.value), e.st === 'burn' ? '#ff9a4a' : '#9cd94a');
          break;
        case 'heal':
          spawnNumber(p.x, p.y - 36, '+' + U.fmt(e.value), '#7fe89a');
          burst(p.x, p.y - 18, '#8fffb0', 6, { vy: -40, g: -10, life: 0.7 });
          break;
        case 'shield':
          spawnNumber(p.x, p.y - 40, '+' + U.fmt(e.value), '#9fd8ff');
          burst(p.x, p.y - 20, '#bfe8ff', 8, { g: 0, life: 0.6 });
          break;
        case 'miss':
          spawnNumber(p.x, p.y - 34, G.locale === 'en' ? 'MISS' : 'ERROU', '#cfd6e0');
          break;
        case 'buffFx': burst(p.x, p.y - 10, '#ffe066', 6, { vy: -50, g: -20, life: 0.7 }); break;
        case 'debuffFx': burst(p.x, p.y - 10, '#b06ce0', 6, { vy: 20, g: 30, life: 0.6 }); break;
        case 'cleanseFx': burst(p.x, p.y - 16, '#ffffff', 10, { g: -30, life: 0.8 }); break;
        case 'statusFx': {
          const col = e.st === 'burn' ? '#ff7a34' : e.st === 'poison' ? '#8ed57f' : e.st === 'stun' ? '#ffe066' : '#9fe8ff';
          burst(p.x, p.y - 18, col, 8, { life: 0.6 });
          break;
        }
        case 'attackFx': {
          const t = e.target ? slotPos(e.target) : p;
          if (e.kind === 'mag') {
            for (let i = 0; i < 6; i++) {
              const k = i / 6;
              spawnPart(U.lerp(p.x, t.x, k), U.lerp(p.y - 18, t.y - 18, k), '#c79bff', { vx: 0, vy: 0, g: 0, life: 0.25, size: 2 });
            }
          }
          break;
        }
        case 'ability':
          if (e.ult) {
            R.shake(6);
            burst(p.x, p.y - 20, '#ffe066', 26, { life: 0.9, size: 3, g: 20 });
            battle.flashScreen = 0.35;
          } else burst(p.x, p.y - 20, '#ffffff', 8, { life: 0.4 });
          break;
        case 'die':
          burst(p.x, p.y - 16, '#ffffff', 14, { life: 0.7 });
          G.audio.play('die');
          break;
        case 'phase':
          R.shake(8); battle.flashScreen = 0.5;
          break;
        case 'tell':
          burst(p.x, p.y - 24, '#ff5f7e', 10, { g: -40, life: 0.8 });
          break;
        case 'summon':
          burst(p.x, p.y - 16, '#b06ce0', 14, { life: 0.8 });
          break;
        case 'victory': case 'defeat': break;
        default: break;
      }
    }
  };

  /* ---------------- desenho ---------------- */
  function drawBar(x, y, w, h, ratio, colFill, colBack, border) {
    ctx.fillStyle = colBack || 'rgba(0,0,0,0.62)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = colFill;
    ctx.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * U.clamp(ratio, 0, 1)), h - 2);
    if (border !== false) {
      ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
  }

  function drawUnit(u) {
    const p = slotPos(u);
    const spec = u.art || { arch: 'humanoid' };
    const anim = u.anim;
    const bob = G.game.settings.reducedMotion ? 0 : Math.sin(time * 2.4 + u.slotIndex) * 1.2;
    let ox = 0, oy = bob, sx = 1, sy = 1, rot = 0, alpha = 1;
    let pose = 'idle';

    switch (anim.state) {
      case 'attack':
        pose = 'action';
        ox = (u.side === 'party' ? 1 : -1) * (1 - anim.t / 0.35) * 10;
        break;
      case 'skill': pose = 'action'; oy -= 3; sy = 1.06; break;
      case 'ultimate': pose = 'action'; oy -= 6 + Math.sin(time * 18) * 2; sx = sy = 1.12; break;
      case 'hit': ox = (u.side === 'party' ? -1 : 1) * 4; sx = 1.08; sy = 0.92; break;
      case 'defeat': alpha = Math.max(0, 0.9 - (0.9 - anim.t)); rot = (u.side === 'party' ? -1 : 1) * 1.1; oy += 6; break;
      default: break;
    }
    if (!u.alive) { alpha = 0.28; rot = (u.side === 'party' ? -1 : 1) * 1.2; oy += 8; pose = 'idle'; }

    const sprite = G.art.sprite(spec, pose);
    const sizeMult = (spec.boss || spec.big) ? 1.5 : 1.35;
    const w = sprite.width * sizeMult, h = sprite.height * sizeMult;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(p.x + ox, p.y + oy);
    if (u.side === 'enemy') ctx.scale(-1, 1);   // inimigos olham para a esquerda
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    if (u.flash > 0 && ctx.filter !== undefined) {
      ctx.filter = 'brightness(' + (1 + u.flash * 6).toFixed(2) + ') saturate(0.4)';
    }
    ctx.drawImage(sprite, -w / 2, -h + 4, w, h);
    if (ctx.filter !== undefined) ctx.filter = 'none';
    ctx.restore();

    if (!u.alive) return;

    // aura de escudo
    if (u.shield > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(time * 5) * 0.1;
      ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 16, 18, 22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // barras
    const bw = u.kind === 'boss' ? 46 : 34;
    const bx = p.x - bw / 2, by = p.y - h * 0.78;
    const hpCol = u.side === 'party' ? '#4fd07a' : (u.kind === 'boss' ? '#ff5f7e' : '#e05a4a');
    drawBar(bx, by, bw, 5, u.hp / u.max.hp, hpCol);
    if (u.shield > 0) drawBar(bx, by, bw, 5, Math.min(1, u.shield / u.max.hp), 'rgba(159,216,255,0.75)', 'rgba(0,0,0,0)', false);
    if (u.side === 'party') drawBar(bx, by + 6, bw, 3, u.energy / 100, '#ffd94a');

    // ícones de status
    const icons = [];
    for (const s of u.status) {
      if (s.st === 'burn') icons.push(['#ff7a34', 'F']);
      else if (s.st === 'poison') icons.push(['#8ed57f', 'V']);
      else if (s.st === 'stun') icons.push(['#ffe066', '!']);
      else if (s.st === 'silence') icons.push(['#b06ce0', 'S']);
      else if (s.st === 'slow') icons.push(['#9fe8ff', 'L']);
      else if (s.st === 'regen') icons.push(['#7fe89a', '+']);
      else if (s.type === 'buff') icons.push(['#ffd94a', '^']);
      else if (s.type === 'debuff') icons.push(['#ff8a8a', 'v']);
    }
    ctx.font = '6px monospace'; ctx.textAlign = 'center';
    for (let i = 0; i < Math.min(6, icons.length); i++) {
      const ix = bx + 3 + i * 6, iy = by - 6;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(ix - 2, iy - 5, 5, 6);
      ctx.fillStyle = icons[i][0]; ctx.fillText(icons[i][1], ix, iy);
    }

    // telégrafo de chefe
    if (u.tell > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(time * 16) * 0.3;
      ctx.strokeStyle = '#ff5f7e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y - 18, 26, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------------- partículas ambientais ---------------- */
  const ambient = [];
  let ambientRegion = null;
  function updateAmbient(regionId, dt) {
    const q = G.game.settings.graphics;
    const target = q === 'low' ? 0 : q === 'medium' ? 18 : 34;
    if (ambientRegion !== regionId) { ambient.length = 0; ambientRegion = regionId; }
    while (ambient.length < target) {
      ambient.push({ x: Math.random() * VW, y: Math.random() * VH * 0.85, s: 0.4 + Math.random(), p: Math.random() * 6.28 });
    }
    while (ambient.length > target) ambient.pop();
    const region = G.regionById[regionId];
    const kind = region ? region.particles : 'pollen';
    for (const a of ambient) {
      a.p += dt;
      switch (kind) {
        case 'rain': a.y += 160 * dt * a.s; a.x -= 30 * dt; break;
        case 'ember': a.y -= 22 * dt * a.s; a.x += Math.sin(a.p) * 12 * dt; break;
        case 'firefly': a.x += Math.cos(a.p * 1.4) * 14 * dt; a.y += Math.sin(a.p) * 12 * dt; break;
        case 'leaf': a.x -= 34 * dt * a.s; a.y += Math.sin(a.p) * 16 * dt; break;
        case 'confetti': a.y += 40 * dt * a.s; a.x += Math.sin(a.p * 2) * 20 * dt; break;
        case 'bubble': a.y -= 18 * dt * a.s; break;
        case 'shadow': a.y -= 10 * dt * a.s; a.x += Math.sin(a.p) * 8 * dt; break;
        case 'crystal': a.y += 14 * dt * a.s; break;
        case 'spore': a.y -= 8 * dt * a.s; a.x += Math.sin(a.p * 0.7) * 10 * dt; break;
        default: a.y -= 6 * dt * a.s; a.x += Math.sin(a.p) * 8 * dt; break;
      }
      if (a.y < -4) a.y = VH * 0.85;
      if (a.y > VH * 0.9) a.y = 0;
      if (a.x < -4) a.x = VW;
      if (a.x > VW + 4) a.x = 0;
    }
  }
  function drawAmbient(regionId) {
    const region = G.regionById[regionId];
    if (!region) return;
    const kind = region.particles;
    const col = region.pal.accent;
    for (const a of ambient) {
      ctx.globalAlpha = kind === 'firefly' ? 0.5 + Math.sin(a.p * 3) * 0.45 : 0.55;
      ctx.fillStyle = col;
      const s = kind === 'rain' ? 1 : Math.max(1, Math.round(a.s * 2));
      ctx.fillRect(a.x | 0, a.y | 0, s, kind === 'rain' ? 4 : s);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- laço de desenho ---------------- */
  R.draw = function (battle, dt) {
    if (!ctx) return;
    time += dt;
    const s = G.game.state;
    const stage = battle && battle.stage ? battle.stage : G.getStage(s ? s.stage : 0);
    const region = G.regionById[stage.region] || G.regions[0];

    // atualiza partículas
    updateAmbient(region.id, dt);
    for (let i = numbers.length - 1; i >= 0; i--) {
      const n = numbers[i];
      n.life -= dt * 1.4; n.y += n.vy * dt; n.x += n.vx * dt; n.vy += 40 * dt;
      if (n.life <= 0) { numbers.splice(i, 1); numPool.put(n); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
      if (p.life <= 0) { parts.splice(i, 1); partPool.put(p); }
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0a0810';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // tremor
    let shx = 0, shy = 0;
    if (shakeT > 0) {
      shakeT -= dt;
      shx = (Math.random() - 0.5) * shake; shy = (Math.random() - 0.5) * shake;
      if (shakeT <= 0) shake = 0;
    }

    const offX = (canvas.width - VW * scale) / 2, offY = (canvas.height - VH * scale) / 2;
    ctx.setTransform(scale, 0, 0, scale, offX + shx, offY + shy);

    // cenário
    const bg = G.art.background(region.pal, VW, VH, region.weather);
    ctx.drawImage(bg, 0, 0);
    drawAmbient(region.id);

    if (battle) {
      // ordena por profundidade
      const units = battle.all.slice().sort((a, b) => slotPos(a).y - slotPos(b).y);
      for (const u of units) drawUnit(u);

      // barra do chefe
      if (battle.isBoss) {
        const boss = battle.enemies.find((e) => e.kind === 'boss');
        if (boss) {
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(VW / 2 - 130, 10, 260, 18);
          drawBar(VW / 2 - 126, 18, 252, 8, boss.hp / boss.max.hp, '#ff5f7e');
          ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
          ctx.fillStyle = '#ffd0d8';
          ctx.fillText(boss.name.toUpperCase(), VW / 2, 16);
          // marcas de fase
          if (boss.phases) {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            boss.phases.forEach((ph, i) => { if (i === 0) return; ctx.fillRect(VW / 2 - 126 + 252 * ph.at, 18, 1, 8); });
          }
        }
      }

      // anúncio de fase / entrada
      if (battle.bossAnnounce && battle.bossAnnounce.text) {
        ctx.globalAlpha = U.clamp(battle.bossAnnounce.t, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(30, VH / 2 - 22, VW - 60, 30);
        ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9a8';
        wrapText(battle.bossAnnounce.text, VW / 2, VH / 2 - 8, VW - 76, 11);
        ctx.globalAlpha = 1;
      }

      // clarão de suprema
      if (battle.flashScreen > 0) {
        battle.flashScreen -= dt * 2;
        ctx.fillStyle = 'rgba(255,255,255,' + U.clamp(battle.flashScreen, 0, 0.5) + ')';
        ctx.fillRect(0, 0, VW, VH);
      }
    }

    // partículas de efeito
    for (const p of parts) {
      ctx.globalAlpha = U.clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x | 0, p.y | 0, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // números
    ctx.textAlign = 'center';
    for (const n of numbers) {
      ctx.globalAlpha = U.clamp(n.life, 0, 1);
      ctx.font = 'bold ' + (n.big ? 13 : 10) + 'px monospace';
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillText(n.text, n.x + 1, n.y + 1);
      ctx.fillStyle = n.color;
      ctx.fillText(n.text, n.x, n.y);
    }
    ctx.globalAlpha = 1;
  };

  function wrapText(text, cx, y, maxW, lh) {
    const words = String(text).split(' ');
    let line = '', lines = [];
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    lines = lines.slice(0, 2);
    lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
  }

  R.clear = function () { numbers.length = 0; parts.length = 0; ambient.length = 0; ambientRegion = null; };
})();


/* ======== src/ui.js ======== */
/* =============================================================

  function rarityColor(r) { return (G.balance.rarityById[r] || { color: '#fff' }).color; }
  function rarityName(r) { const x = G.balance.rarityById[r]; return x ? G.tn(x) : r; }

  UI.toast = function (text, kind) {

  UI.modal = function (title, content, actions, opts) {
    const overlay = el('div', { class: 'modal-overlay' });

    box.appendChild(el('div', { class: 'modal-title' }, [

      el('button', { class: 'x', text: '✕', onclick: close, 'aria-label': t('close') })
    ]));
    const body = el('div', { class: 'modal-body' });
    if (typeof content === 'string') body.innerHTML = content; else body.appendChild(content);
    box.appendChild(body);
    if (actions && actions.length) {

      })));
      box.appendChild(row);
    }
    overlay.appendChild(box);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    root.appendChild(overlay);
    function close() { G.audio.play('back'); overlay.remove(); }
    overlay.close = close;

    G.game.events.on('story', (region) => UI.showStory(region));

    tools.appendChild(el('button', { class: 'tbtn', text: '🔊', id: 'btn-mute', title: 'M', onclick: toggleMute }));
    tools.appendChild(el('button', { class: 'tbtn', text: '⛶', title: 'F', onclick: () => G.main.toggleFullscreen() }));
    tools.appendChild(el('button', { class: 'tbtn', text: '⚙', title: t('settings'), onclick: () => UI.show('settings') }));
    topbar.appendChild(tools);

    G.game.settings.muted = m;
    const b = U.qs('#btn-mute'); if (b) b.textContent = m ? '🔇' : '🔊';
    G.save.saveSettings(G.game.settings);
  }

  function updateTopbar() {

    set('gold', s.gold); set('gems', s.gems); set('essence', s.essence); set('tokens', s.tokens);
  }
  UI.updateTopbar = updateTopbar;

  const NAV = [
    { id: 'battle', label: 'navBattle', icon: '⚔' },
    { id: 'map', label: 'navMap', icon: '🗺' },
    { id: 'heroes', label: 'navHeroes', icon: '👤' },
    { id: 'bag', label: 'navBag', icon: '🎒' },
    { id: 'craft', label: 'navCraft', icon: '🔨' },
    { id: 'quests', label: 'navQuests', icon: '📜' },
    { id: 'bestiary', label: 'navBestiary', icon: '📖' },
    { id: 'companions', label: 'navCompanions', icon: '🐾' },
    { id: 'idle', label: 'navIdle', icon: '⏳' },
    { id: 'achievements', label: 'navAch', icon: '🏆' },
    { id: 'prestige', label: 'navPrestige', icon: '✨' }
  ];

  function buildNav() {

  UI.show = function (id) {

    U.clear(screenEl);

  /* ==========================================================

  function mkToggle(key, label) {

  /** Chamado a cada quadro pelo main loop. */
  UI.updateHud = function () {
    if (UI.current !== 'battle') return;
    const b = G.game.battle, s = G.game.state;
    if (hud.stageLabel) {
      const stage = G.getStage(s.stage);
      const region = G.regionById[stage.region];

    }
    if (!b) return;
    for (const c of hud.cards) {
      const u = c.unit;

      c.en.style.width = U.clamp(u.energy / 100, 0, 1) * 100 + '%';
      const ready = u.alive && u.energy >= 100 && u.ultimate && u.ultimate.cd <= 0;

        if (hud.result.dataset.k !== r.result + r.stage) {

          if (r.result === 'victory' && r.gained) {
            const g = r.gained;
            const line = el('div', { class: 'rl' });
            line.appendChild(el('span', { text: '+' + fmt(g.gold) + ' ' + t('gold') }));
            line.appendChild(el('span', { text: '+' + fmt(g.xp) + ' ' + t('exp') }));
            for (const m in g.mats) line.appendChild(el('span', { text: '+' + g.mats[m] + ' ' + G.tn(G.materialById[m]) }));
            if (g.items && g.items.length) line.appendChild(el('span', { class: 'drop', text: '★ ' + g.items.map((i) => G.game.itemName(i)).join(', ') }));
            hud.result.appendChild(line);
          } else if (r.result === 'defeat') {
            hud.result.appendChild(el('div', { class: 'rl' }, [el('span', { text: t('defeatHint') })]));
          }
        }
      } else if (hud.result.dataset.k) {
        hud.result.dataset.k = ''; hud.result.className = 'bt-result hidden'; U.clear(hud.result);
      }
    }
  };

  /* ---------- MAPA ---------- */
  SCREENS.map = function (c) {
    const s = G.game.state;
    c.appendChild(el('h2', { class: 'title', text: t('worldMap') }));
    c.appendChild(el('div', { class: 'sub', text: t('bestStage') + ': ' + (s.maxStage + 1) + ' · ' + t('power') + ': ' + fmt(G.game.partyPower()) }));
    const grid = el('div', { class: 'region-grid' });
    G.regions.forEach((r, ri) => {
      const firstStage = ri * 12;
      const unlocked = s.maxStage >= firstStage;
      const card = el('div', { class: 'region' + (unlocked ? '' : ' locked') });
      const strip = el('canvas', { class: 'pix rstrip' });
      strip.width = 120; strip.height = 40;
      const bg = G.art.background(r.pal, 120, 40, r.weather);
      strip.getContext('2d').drawImage(bg, 0, 0);
      card.appendChild(strip);
      card.appendChild(el('div', { class: 'rname', text: G.tn(r) }));
      card.appendChild(el('div', { class: 'rdesc', text: G.td(r, 'desc') }));
      if (!unlocked) card.appendChild(el('div', { class: 'rlock', text: t('regionLocked') }));
      else {
        const stages = el('div', { class: 'stage-list' });
        for (let i = 0; i < 12; i++) {
          const abs = ri * 12 + i;
          const st = G.stages[abs];
          const cleared = s.maxStage > abs;
          const avail = s.maxStage >= abs;
          const cls = 'stg ' + st.type + (cleared ? ' cleared' : '') + (abs === s.stage ? ' current' : '') + (avail ? '' : ' locked');
          stages.appendChild(el('button', {
            class: cls, text: (i + 1),
            title: G.tn(st) + ' · ' + t('recPower') + ' ' + fmt(st.power),
            onclick: () => {
              if (!avail) { G.audio.play('error'); return; }
              G.audio.play('click'); G.game.setStage(abs); UI.show('battle');
            }
          }));
        }
        card.appendChild(stages);
        card.appendChild(el('button', { class: 'btn small', text: t('story'), onclick: () => UI.showStory(r) }));
      }
      grid.appendChild(card);
    });
    c.appendChild(grid);
    if (s.maxStage >= G.STAGE_COUNT) {
      c.appendChild(el('div', { class: 'panel', html: '<b>' + G.t('navMap') + ' — Vale do Eclipse ∞</b><br>' + (G.locale === 'en' ? 'Endless depths keep scaling for idle progress.' : 'As profundezas infinitas continuam escalando para o progresso ocioso.') }));
      c.appendChild(btn(t('nextStage') + ' ∞', () => { G.game.setStage(Math.min(s.maxStage, G.STAGE_COUNT + 40)); UI.show('battle'); }, 'small'));
    }
  };

    stats.appendChild(statRow(t('def'), fmt(st.def), t('tip_def')));
    stats.appendChild(statRow(t('mag'), fmt(st.mag), t('tip_mag')));
    stats.appendChild(statRow(t('res'), fmt(st.res), t('tip_res')));
    stats.appendChild(statRow(t('spd'), st.spd.toFixed(2), t('tip_spd')));
    stats.appendChild(statRow(t('crit'), U.pct(st.crit), t('tip_crit')));
    stats.appendChild(statRow(t('critDmg'), U.pct(st.critDmg), t('tip_critDmg')));
    stats.appendChild(statRow(t('dodge'), U.pct(st.dodge), t('tip_dodge')));
    stats.appendChild(statRow(t('acc'), U.pct(st.acc), t('tip_acc')));
    stats.appendChild(statRow(t('lifesteal'), U.pct(st.lifesteal), t('tip_lifesteal')));
    stats.appendChild(statRow(t('healPow'), U.pct(st.healPow), t('tip_healPow')));

  function abilityRow(a, heroId) {

    const lvl = a.id ? (s.heroes[heroId].skills[a.id] || 1) : 1;
    const row = el('div', { class: 'abil' });
    const tag = a.type === 'ultimate' ? 'ULT' : a.type === 'passive' ? t('passive') : a.type === 'basic' ? '•' : t('active');
    row.appendChild(el('div', { class: 'abil-tag ' + (a.type || ''), text: tag }));
    const info = el('div', { class: 'abil-info' });
    info.appendChild(el('div', { class: 'abil-name', text: G.tn(a) + (a.id && a.type !== 'passive' ? ' — Nv.' + lvl : '') }));
    info.appendChild(el('div', { class: 'abil-desc', text: G.td(a, 'desc') }));
    if (a.cd) info.appendChild(el('div', { class: 'abil-cd', text: t('cooldown') + ': ' + a.cd + 's' }));
    row.appendChild(info);
    if (a.id && a.type !== 'passive' && lvl < G.balance.hero.skillMaxLevel) {
      row.appendChild(btn('+ ' + fmt(G.game.skillCost(heroId, a.id)), () => {
        if (G.game.upgradeSkill(heroId, a.id)) { U.qsa('.modal-overlay').forEach((o) => o.remove()); heroDetail(heroId); }
      }, 'tiny'));
    }
    return row;
  }

  function pickItemForSlot(heroId, slotId) {
    const s = G.game.state;
    const list = s.inventory.filter((i) => G.equipById[i.base].slot === slotId);
    if (!list.length) { UI.toast(t('none'), 'warn'); return; }
    list.sort((a, b) => G.game.itemPower(b) - G.game.itemPower(a));
    const box = el('div', { class: 'item-list' });
    list.forEach((i) => box.appendChild(itemRow(i, () => { G.game.equipItem(heroId, i.uid); U.qsa('.modal-overlay').forEach((o) => o.remove()); heroDetail(heroId); })));
    UI.modal(t('equip') + ' — ' + G.tn(G.slotById[slotId]), box, [{ label: t('close') }], { wide: true });
  }

    const owner = G.game.isEquipped(item);
    const row = el('div', { class: 'irow', onclick: onclick });
    row.appendChild(iconEl(G.slotById[base.slot].icon, rarityColor(item.rarity), 24));
    const info = el('div', { class: 'irow-info' });
    info.appendChild(el('div', { class: 'irow-name', style: { color: rarityColor(item.rarity) }, text: G.tn(base) + (item.up ? ' +' + item.up : '') + (item.locked ? ' 🔒' : '') }));
    info.appendChild(el('div', { class: 'irow-sub', text: rarityName(item.rarity) + ' · Nv.' + item.ilvl + ' · ' + t('power') + ' ' + fmt(G.game.itemPower(item)) + (owner ? ' · ' + t('equipped') + ' ' + G.tn(G.heroById[owner]) : '') }));
    row.appendChild(info);
    return row;
  }

  SCREENS.bag = function (c) {

    c.appendChild(el('h2', { class: 'title', text: t('inventory') + ' (' + s.inventory.length + '/' + G.balance.loot.maxInventory + ')' }));

    const bar = el('div', { class: 'filter-bar' });

    bar.appendChild(rsel);
    const ssel = el('select', { onchange: function () { itemFilter.slot = this.value; UI.show('bag'); } });
    ssel.appendChild(el('option', { value: 'all', text: t('all') }));
    G.slots.forEach((sl) => ssel.appendChild(el('option', { value: sl.id, text: G.tn(sl) })));

    bar.appendChild(ssel);
    bar.appendChild(btn(t('bulkSell'), () => G.game.bulkAction('sell'), 'small warn'));

    c.appendChild(bar);

    let list = s.inventory.slice();
    if (itemFilter.rarity !== 'all') list = list.filter((i) => i.rarity === itemFilter.rarity);
    if (itemFilter.slot !== 'all') list = list.filter((i) => G.equipById[i.base].slot === itemFilter.slot);

  function itemModal(item, fromHero) {
    const base = G.equipById[item.base];
    const set = G.setById[base.set];
    const stats = G.game.itemStats(item);
    const box = el('div', { class: 'item-detail' });
    box.appendChild(el('div', { class: 'id-head' }, [
      iconEl(G.slotById[base.slot].icon, rarityColor(item.rarity), 34),
      el('div', {}, [
        el('div', { class: 'id-name', style: { color: rarityColor(item.rarity) }, text: G.tn(base) + (item.up ? ' +' + item.up : '') }),
        el('div', { class: 'id-sub', text: rarityName(item.rarity) + ' · ' + G.tn(G.slotById[base.slot]) + ' · ' + t('reqLevel') + ' ' + base.minLevel })
      ])
    ]));
    const sg = el('div', { class: 'stat-grid' });
    for (const k in stats) {
      if (k === 'setSpecials') continue;
      const isPct = ['crit', 'dodge', 'acc', 'critDmg', 'lifesteal', 'healPow', 'cdr', 'elemRes'].indexOf(k) >= 0;
      sg.appendChild(statRow(t(k) || k, isPct ? U.pct(stats[k]) : fmt(stats[k]), t('tip_' + k) || ''));
    }
    box.appendChild(sg);
    box.appendChild(el('div', { class: 'id-power', text: t('power') + ': ' + fmt(G.game.itemPower(item)) + ' · ' + t('sellValue') + ': ' + fmt(G.game.sellValue(item)) }));

    if (set) {
      const sb = el('div', { class: 'setbox' });
      sb.appendChild(el('div', { class: 'set-name', style: { color: set.color }, text: t('setBonus') + ': ' + G.tn(set) }));
      set.bonuses.forEach((b) => sb.appendChild(el('div', { class: 'set-line', text: b.pieces + ' ' + t('pieces') + ' — ' + G.td(b, 'desc') })));
      box.appendChild(sb);
    }

    const owner = G.game.isEquipped(item);
    if (owner) box.appendChild(el('div', { class: 'id-owner', text: t('equipped') + ': ' + G.tn(G.heroById[owner]) }));

    const acts = [];
    if (item.up < G.balance.loot.upgradeMaxLevel) {
      acts.push({
        label: t('upgrade') + ' (' + fmt(G.game.upgradeCost(item)) + ')', cls: 'ok',
        fn: () => { if (G.game.upgradeItem(item.uid)) { UI.show(UI.current); } return true; }
      });
    }
    acts.push({ label: item.locked ? t('unlock2') : t('lock'), fn: () => { G.game.toggleLock(item.uid); UI.show(UI.current); } });
    if (!owner) {
      acts.push({
        label: t('equip'), cls: 'ok', fn: () => {
          const s = G.game.state;
          const target = fromHero || s.party[0];
          if (target) { G.game.equipItem(target, item.uid); UI.toast(t('equip') + ' → ' + G.tn(G.heroById[target]), 'ok'); }
        }
      });
      acts.push({ label: t('sell'), cls: 'warn', fn: () => { G.game.sellItem(item.uid); UI.show(UI.current); } });
      acts.push({ label: t('dismantle'), cls: 'warn', fn: () => { G.game.dismantleItem(item.uid); UI.show(UI.current); } });
    } else {
      acts.push({ label: t('unequip'), fn: () => { G.game.unequipItem(owner, base.slot); UI.show(UI.current); } });
    }
    acts.push({ label: t('close') });
    UI.modal(G.game.itemName(item), box, acts, { wide: true });
  }

      card.appendChild(el('div', { class: 'rc-desc', text: G.td(r, 'desc') }));
      const cost = el('div', { class: 'rc-cost' });
      if (r.cost.gold) cost.appendChild(el('span', { class: (s.gold >= r.cost.gold ? 'ok' : 'no'), text: fmt(r.cost.gold) + ' ' + t('gold') }));
      for (const m in r.cost.mats || {}) {
        const have = s.mats[m] || 0;
        cost.appendChild(el('span', { class: (have >= r.cost.mats[m] ? 'ok' : 'no'), text: G.tn(G.materialById[m]) + ' ' + have + '/' + r.cost.mats[m] }));
      }
      card.appendChild(cost);
      if (!unlocked) card.appendChild(el('div', { class: 'rc-lock', text: t('locked') + ' — ' + t('stage') + ' ' + r.unlock }));
      else {
        if (r.needsItem) card.appendChild(btn(craftSelection.item ? G.game.itemName(G.game.getItem(craftSelection.item) || {}) : t('selectItem'), () => selectItemForCraft(), 'small'));
        if (r.needsHero) card.appendChild(btn(craftSelection.hero ? G.tn(G.heroById[craftSelection.hero]) : t('selectHero'), () => selectHeroForCraft(), 'small'));
        card.appendChild(btn(t('craft'), () => {
          const extra = r.needsItem ? craftSelection.item : r.needsHero ? craftSelection.hero : null;
          G.game.craft(r.id, extra); UI.show('craft');
        }, 'small ok', !can));
      }
      list.appendChild(card);
    });
    c.appendChild(list);
  };

  function selectItemForCraft() {
    const s = G.game.state;
    const box = el('div', { class: 'item-list' });
    s.inventory.slice().sort((a, b) => G.game.itemPower(b) - G.game.itemPower(a)).forEach((i) => {
      box.appendChild(itemRow(i, () => { craftSelection.item = i.uid; U.qsa('.modal-overlay').forEach((o) => o.remove()); UI.show('craft'); }));
    });
    if (!s.inventory.length) box.appendChild(el('div', { class: 'pad dim', text: t('none') }));
    UI.modal(t('selectItem'), box, [{ label: t('close') }], { wide: true });
  }
  function selectHeroForCraft() {
    const box = el('div', { class: 'item-list' });
    G.heroes.forEach((h) => box.appendChild(el('div', {
      class: 'irow', onclick: () => { craftSelection.hero = h.id; U.qsa('.modal-overlay').forEach((o) => o.remove()); UI.show('craft'); }
    }, [canvasEl(G.art.portrait(h.art, rarityColor(h.rarity)), 32), el('div', { class: 'irow-info' }, [el('div', { class: 'irow-name', text: G.tn(h) })])])));
    UI.modal(t('selectHero'), box, [{ label: t('close') }], { wide: true });

  /* ---------- MISSÕES ---------- */
  let questTab = 'main';
  SCREENS.quests = function (c) {
    const s = G.game.state;
    c.appendChild(el('h2', { class: 'title', text: t('quests') }));
    const tabs = el('div', { class: 'tabs' });
    Object.keys(G.questKinds).forEach((k) => {
      tabs.appendChild(el('button', {
        class: 'tab' + (questTab === k ? ' on' : ''), text: G.tn(G.questKinds[k]),
        onclick: () => { questTab = k; G.audio.play('tab'); UI.show('quests'); }
      }));
    });
    c.appendChild(tabs);

    if (questTab === 'daily') c.appendChild(el('div', { class: 'sub', text: t('resetsIn') + ' ' + U.time((s.dailyResetAt - Date.now()) / 1000) }));
    if (questTab === 'weekly') c.appendChild(el('div', { class: 'sub', text: t('resetsIn') + ' ' + U.time((s.weeklyResetAt - Date.now()) / 1000) }));

    const list = el('div', { class: 'quest-list' });
    const qs = G.quests.filter((q) => q.kind === questTab);
    qs.forEach((q) => {
      const st = s.quests[q.id];
      const done = st.prog >= q.obj.count;
      const card = el('div', { class: 'quest' + (st.claimed ? ' claimed' : done ? ' done' : '') });
      card.appendChild(el('div', { class: 'q-title', text: G.tn(q) }));
      card.appendChild(el('div', { class: 'q-meta', text: G.tn(G.questKinds[q.kind]) + ' · ' + t('recPower') + ' Nv.' + q.lvl + ' · ' + (G.regionById[q.region] ? G.tn(G.regionById[q.region]) : t('all')) }));
      card.appendChild(el('div', { class: 'q-desc', text: G.td(q, 'desc') }));
      const pr = el('div', { class: 'q-prog' }, [el('i', { style: { width: U.clamp(st.prog / q.obj.count, 0, 1) * 100 + '%' } })]);
      card.appendChild(pr);
      card.appendChild(el('div', { class: 'q-progtext', text: t('progress') + ': ' + fmt(Math.min(st.prog, q.obj.count)) + '/' + fmt(q.obj.count) }));
      const rw = el('div', { class: 'q-rw' });
      if (q.rewards.gold) rw.appendChild(el('span', { text: fmt(q.rewards.gold) + ' ' + t('gold') }));
      if (q.rewards.gems) rw.appendChild(el('span', { text: q.rewards.gems + ' ' + t('gems') }));
      if (q.rewards.xp) rw.appendChild(el('span', { text: fmt(q.rewards.xp) + ' ' + t('exp') }));
      for (const m in q.rewards.mats || {}) rw.appendChild(el('span', { text: q.rewards.mats[m] + ' ' + G.tn(G.materialById[m]) }));
      card.appendChild(rw);
      card.appendChild(btn(st.claimed ? t('completed') : t('claimReward'), () => { G.game.claimQuest(q.id); UI.show('quests'); }, 'small ok', st.claimed || !done));
      list.appendChild(card);
    });
    if (!qs.length) list.appendChild(el('div', { class: 'pad dim', text: t('noQuests') }));
    c.appendChild(list);
  };

  /* ---------- BESTIÁRIO ---------- */

    const total = G.allEnemies.length;

  function bestiaryDetail(e) {
    const s = G.game.state;
    const box = el('div', {});
    box.appendChild(canvasEl(G.art.sprite(e.art, 'idle'), 128));
    box.appendChild(el('p', { text: G.td(e, 'lore') }));
    box.appendChild(el('p', { html: '<b>' + t('category') + ':</b> ' + U.esc(e.cat) + ' · <b>' + t('element') + ':</b> ' + G.balance.elements.icons[e.element] + ' ' + (G.locale === 'en' ? G.balance.elements.namesEn : G.balance.elements.names)[e.element] }));
    box.appendChild(el('p', { html: '<b>' + t('defeated') + ':</b> ' + fmt(s.bestiary[e.id] || 0) }));

  /* ---------- COMPANHEIROS ---------- */
  SCREENS.companions = function (c) {
    const s = G.game.state;
    c.appendChild(el('h2', { class: 'title', text: t('companions') }));
    c.appendChild(el('div', { class: 'sub', text: t('activeCompanion') + ': ' + (s.activeCompanion ? G.tn(G.companionById[s.activeCompanion]) : t('noCompanion')) }));
    const grid = el('div', { class: 'comp-grid' });
    G.companions.forEach((cp) => {
      const cs = s.companions[cp.id];
      const un = cs && cs.unlocked;
      const card = el('div', { class: 'ccard' + (un ? '' : ' locked') + (s.activeCompanion === cp.id ? ' active' : '') });
      card.appendChild(canvasEl(G.art.sprite(cp.art, 'idle'), 64));
      card.appendChild(el('div', { class: 'cname', text: un ? (G.locale === 'en' ? cp.evolutionsEn : cp.evolutions)[cs.evo] : '???' }));
      card.appendChild(el('div', { class: 'cdesc', text: un ? G.td(cp, 'desc') : unlockText(cp) }));
      if (un) {
        card.appendChild(el('div', { class: 'clvl', text: t('level') + ' ' + cs.lvl + '/' + G.companionBalance.maxLevel + ' · ' + t('evolution') + ' ' + (cs.evo + 1) }));
        const bonus = [];
        for (const k in cp.bonus) bonus.push((t(k) || k) + ' +' + U.pct(cp.bonus[k] * (1 + cs.evo * G.companionBalance.evolveBonus)));
        card.appendChild(el('div', { class: 'cbonus', text: t('companionBonus') + ': ' + bonus.join(', ') }));
        card.appendChild(btn(t('setActive'), () => { G.game.setCompanion(cp.id); UI.show('companions'); }, 'small ok', s.activeCompanion === cp.id));
        card.appendChild(btn(t('feed') + ' (1 ' + G.tn(G.materialById.pedra_aprimoramento) + ')', () => { G.game.feedCompanion(cp.id, 1); UI.show('companions'); }, 'small'));
        const at = G.companionBalance.evolveAt[cs.evo];
        if (at !== undefined) card.appendChild(btn(t('evolve') + ' (Nv.' + at + ')', () => { G.game.evolveCompanion(cp.id); UI.show('companions'); }, 'small', cs.lvl < at));
      }
      grid.appendChild(card);
    });
    c.appendChild(grid);
  };
  function unlockText(cp) {
    if (cp.unlock.type === 'stage') return t('locked') + ' — ' + t('stage') + ' ' + cp.unlock.value;
    if (cp.unlock.type === 'boss') return t('locked') + ' — ' + t('boss') + ': ' + G.tn(G.enemyById[cp.unlock.value] || {});
    return t('locked');
  }

    const panel = el('div', { class: 'panel' });

    const mats = Object.keys(bank.mats).map((m) => G.tn(G.materialById[m]) + ' x' + bank.mats[m]).join(', ');
    if (mats) panel.appendChild(el('div', { text: t('materials') + ': ' + mats }));
    panel.appendChild(btn(t('claimIdle'), () => { const g = G.idle.claimBank(); if (g) UI.toast('+' + fmt(g.gold) + ' ' + t('gold'), 'ok'); UI.show('idle'); }, 'ok'));
    const gm = G.game.globalMods();

      const lv = G.game.idleLevel(u.id);

      card.appendChild(el('div', { class: 'up-name', text: G.tn(u) + ' — ' + lv + '/' + u.max }));

      list.appendChild(card);
    });
    c.appendChild(list);

  SCREENS.achievements = function (c) {

    c.appendChild(el('h2', { class: 'title', text: t('achievements') + ' ' + done + '/' + G.achievements.length }));
    const list = el('div', { class: 'ach-list' });
    G.achievements.forEach((a) => {
      const got = !!s.achievements[a.id];
      const v = s.stats[a.stat] || 0;
      const card = el('div', { class: 'ach' + (got ? ' got' : '') });
      card.appendChild(el('div', { class: 'ach-ic', text: got ? '🏆' : '🔒' }));

      info.appendChild(el('div', { class: 'ach-desc', text: G.td(a, 'desc') }));
      info.appendChild(el('div', { class: 'q-prog' }, [el('i', { style: { width: U.clamp(v / a.need, 0, 1) * 100 + '%' } })]));

    g.appendChild(statRow(t('prestige'), fmt(s.stats.prestiges)));
    c.appendChild(g);

  /* ---------- AJUSTES ---------- */
  SCREENS.settings = function (c) {
    const st = G.game.settings;
    c.appendChild(el('h2', { class: 'title', text: t('settings') }));
    const panel = el('div', { class: 'panel' });

    // idioma
    const lsel = el('select', {
      onchange: function () {
        st.locale = this.value; G.setLocale(this.value); G.save.saveSettings(st);
        buildTopbar(); buildNav(); UI.show('settings');
      }
    });
    G.locales.forEach((l) => lsel.appendChild(el('option', { value: l.id, text: l.label, selected: st.locale === l.id ? 'selected' : null })));
    panel.appendChild(row(t('language'), lsel));

    // volumes
    ['music', 'sfx', 'ui'].forEach((busId) => {
      const label = busId === 'music' ? t('volumeMusic') : busId === 'sfx' ? t('volumeSfx') : t('volumeUi');
      const sl = el('input', {
        type: 'range', min: '0', max: '1', step: '0.05', value: st[busId],
        oninput: function () { st[busId] = +this.value; G.audio.setVolume(busId, +this.value); G.save.saveSettings(st); }
      });
      panel.appendChild(row(label, sl));
    });

    // gráficos
    const gsel = el('select', {
      onchange: function () { st.graphics = this.value; G.save.saveSettings(st); G.render.resize(); }
    });
    [['low', t('low')], ['medium', t('medium')], ['high', t('high')]].forEach((o) =>
      gsel.appendChild(el('option', { value: o[0], text: o[1], selected: st.graphics === o[0] ? 'selected' : null })));
    panel.appendChild(row(t('graphics'), gsel));

    // toggles
    [['reducedMotion', t('reducedMotion')], ['screenShake', t('screenShake')],
     ['damageNumbers', t('damageNumbers')], ['highContrast', t('highContrast')],
     ['autoSave', t('autoSave')]].forEach((o) => {
      const b = el('button', {
        class: 'tgl' + (st[o[0]] ? ' on' : ''), text: st[o[0]] ? t('yes') : t('no'),
        onclick: function () {
          st[o[0]] = !st[o[0]]; this.classList.toggle('on', st[o[0]]);
          this.textContent = st[o[0]] ? t('yes') : t('no');
          G.save.saveSettings(st); G.main.applySettings();
        }
      });
      panel.appendChild(row(o[1], b));
    });

    // tamanho do texto
    const tsel = el('input', {
      type: 'range', min: '0.85', max: '1.4', step: '0.05', value: st.textScale,
      oninput: function () { st.textScale = +this.value; G.main.applySettings(); G.save.saveSettings(st); }
    });
    panel.appendChild(row(t('textScale'), tsel));

    // horas offline
    const osel = el('input', {
      type: 'range', min: '1', max: '24', step: '1', value: st.maxOfflineHours,
      oninput: function () { st.maxOfflineHours = +this.value; G.save.saveSettings(st); this.nextSibling && (this.nextSibling.textContent = this.value + 'h'); }
    });
    panel.appendChild(row(t('maxOfflineHours'), osel));

    c.appendChild(panel);

    // save
    const sp = el('div', { class: 'panel' });
    const status = el('div', { class: 'save-status' });
    sp.appendChild(status);
    refreshSaveStatus(status);
    sp.appendChild(btn(t('saveNow'), () => {
      const ok = G.game.saveNow();
      if (ok) UI.toast(t('saved'), 'ok');
      refreshSaveStatus(status);
    }, 'small'));
    sp.appendChild(btn(t('exportSave'), () => {
      const str = G.save.exportString(G.game.serialize());
      const ta = el('textarea', { class: 'save-area', readonly: 'readonly' });
      ta.value = str;
      const box = el('div', {}, [el('p', { text: t('exportSave') }), ta]);
      UI.modal(t('exportSave'), box, [
        { label: t('copySave'), cls: 'ok', fn: () => { ta.select(); try { document.execCommand('copy'); UI.toast(t('saveExported'), 'ok'); } catch (e) { UI.toast(t('saveInvalid'), 'warn'); } return false; } },
        { label: t('close') }
      ], { wide: true });
    }, 'small'));
    sp.appendChild(btn(t('importSave'), () => {
      const ta = el('textarea', { class: 'save-area', placeholder: t('pasteSave') });
      UI.modal(t('importSave'), el('div', {}, [ta]), [
        {
          label: t('confirm'), cls: 'ok', fn: () => {
            const data = G.save.importString(ta.value);
            if (!data) { UI.toast(t('saveInvalid'), 'warn'); return false; }
            G.game.init(data); G.save.write(G.game.serialize());
            UI.toast(t('saveImported'), 'ok');
            G.render.clear(); G.game.startBattle(G.game.state.stage); UI.show('battle');
          }
        },
        { label: t('cancel') }
      ], { wide: true });
    }, 'small'));
    sp.appendChild(btn(t('deleteSave'), () => {
      UI.modal(t('deleteSave'), el('p', { text: t('newGameWarn') }), [
        { label: t('confirm'), cls: 'warn', fn: () => { G.save.wipe(); location.reload(); } },
        { label: t('cancel') }
      ]);
    }, 'small warn'));
    c.appendChild(sp);

    // controles e créditos
    const cp = el('div', { class: 'panel' });
    cp.appendChild(el('h3', { text: t('controls') }));
    cp.appendChild(el('div', {
      class: 'dim', html: [
        'Espaço — ' + t('ultimate'), '1-4 — ' + t('ultimate') + ' (herói)', 'Esc — ' + t('pause'),
        'M — ' + (G.locale === 'en' ? 'mute' : 'mudo'), 'F — ' + t('fullscreen'), 'Tab — ' + t('navParty'),
        'I — ' + t('inventory'), 'Q — ' + t('quests'), 'B — ' + t('bestiary')
      ].join('<br>')
    }));
    cp.appendChild(el('h3', { text: t('credits') }));
    cp.appendChild(el('div', { class: 'dim', text: t('creditsText') }));
    c.appendChild(cp);
  };

  function row(label, node) {
    return el('div', { class: 'srow' }, [el('span', { class: 'slabel', text: label }), node]);
  }

  /** Mostra, de forma verificável, se o progresso está mesmo sendo gravado. */
  function refreshSaveStatus(node) {
    U.clear(node);
    if (!G.save.available) {
      node.className = 'save-status bad';
      node.appendChild(el('div', { text: '⚠ ' + t('storageWarning') }));
      return;
    }
    const info = G.save.lastSaveInfo();
    node.className = 'save-status ' + (info ? 'ok' : 'warn');
    if (info) {
      const secs = Math.max(0, Math.round((Date.now() - info.at) / 1000));
      node.appendChild(el('div', { text: '✔ ' + t('saveWorking') }));
      node.appendChild(el('div', { class: 'dim', text: t('lastSave') + ': ' + (secs < 5 ? t('justNow') : U.time(secs) + ' ' + t('ago')) + ' · ' + (info.size / 1024).toFixed(1) + ' KB' }));
    } else {
      node.appendChild(el('div', { text: t('noSaveYet') }));
    }
  }

  /* ==========================================================
   * MODAIS ESPECIAIS
   * ======================================================== */
  UI.showOffline = function (result) {
    const box = el('div', { class: 'offline' });
    box.appendChild(el('p', { text: t('offlineExplain') }));
    box.appendChild(el('p', { html: '<b>' + t('offlineTime') + ':</b> ' + U.time(result.counted) + (result.capped ? ' — ' + t('offlineCapped', { n: result.capHours }) : '') }));
    const g = el('div', { class: 'stat-grid' });
    g.appendChild(statRow(t('gold'), '+' + fmt(result.gold)));
    g.appendChild(statRow(t('exp'), '+' + fmt(result.xp)));
    g.appendChild(statRow(t('equipment'), '+' + result.itemCount));
    for (const m in result.mats) g.appendChild(statRow(G.tn(G.materialById[m]), '+' + result.mats[m]));
    box.appendChild(g);
    UI.modal(t('welcomeBack'), box, [{ label: t('claim'), cls: 'ok', fn: () => { G.idle.claimOffline(result); updateTopbar(); } }], { wide: true });
  };

  UI.showDaily = function () {
    const s = G.game.state;
    const box = el('div', { class: 'daily' });
    const grid = el('div', { class: 'daily-grid' });
    G.balance.daily.forEach((d, i) => {
      const claimed = s.daily.streak > i && !G.game.canClaimDaily();
      const cell = el('div', { class: 'dcell' + (claimed ? ' got' : '') + (s.daily.streak === i && G.game.canClaimDaily() ? ' next' : '') });
      cell.appendChild(el('div', { class: 'dday', text: t('day') + ' ' + (i + 1) }));
      if (d.gold) cell.appendChild(el('div', { text: fmt(d.gold) + ' ' + t('gold') }));
      if (d.gems) cell.appendChild(el('div', { text: d.gems + ' ' + t('gems') }));
      if (d.mats) for (const m in d.mats) cell.appendChild(el('div', { text: d.mats[m] + ' ' + G.tn(G.materialById[m]) }));
      grid.appendChild(cell);
    });
    box.appendChild(grid);
    const can = G.game.canClaimDaily();
    UI.modal(t('dailyReward'), box, [
      { label: can ? t('claim') : t('dailyClaimed'), cls: 'ok', fn: () => { if (can) { G.game.claimDaily(); updateTopbar(); } } }
    ]);
  };

  /* ---------- MENU PRINCIPAL ---------- */
  UI.showMenu = function (onStart) {
    const overlay = el('div', { class: 'menu-overlay' });
    const logoC = G.art.logo(360, 140);
    const lg = canvasEl(logoC, 360);
    lg.style.height = 'auto';
    overlay.appendChild(lg);
    overlay.appendChild(el('h1', { class: 'menu-title', text: t('gameTitle') }));
    overlay.appendChild(el('h2', { class: 'menu-sub', text: t('gameSub') }));
    const bts = el('div', { class: 'menu-btns' });
    const has = G.save.hasSave();
    if (has) bts.appendChild(btn(t('continue'), () => { overlay.remove(); onStart(false); }, 'big ok'));
    bts.appendChild(btn(t('newGame'), () => {
      if (has) {
        UI.modal(t('newGame'), el('p', { text: t('newGameWarn') }), [
          { label: t('confirm'), cls: 'warn', fn: () => { overlay.remove(); onStart(true); } },
          { label: t('cancel') }
        ]);
      } else { overlay.remove(); onStart(true); }
    }, 'big'));
    bts.appendChild(btn(t('settings'), () => { overlay.remove(); onStart(false); setTimeout(() => UI.show('settings'), 60); }, 'big'));
    bts.appendChild(btn(t('credits'), () => {
      UI.modal(t('credits'), el('p', { text: t('creditsText') }), [{ label: t('close') }]);
    }, 'big'));
    overlay.appendChild(bts);
    // Sem aviso de orientação aqui: a dica aparece uma vez, em popup fechável.
    root.appendChild(overlay);
  };

  UI.canvasEl = canvasEl;
  UI.iconEl = iconEl;
})();


/* ======== src/main.js ======== */
/* =============================================================
 * main.js — inicialização, laço principal, teclado, tela cheia,
 * salvamento automático e verificação de progresso offline.
 * ============================================================= */
(function () {
  'use strict';
  const G = (window.LDB = window.LDB || {});
  const U = G.util;
  const M = (G.main = {});

  let running = false, paused = false, saveTimer = 0, hidden = false;
  let startedFresh = false;

  M.boot = function () {
    const rootEl = document.getElementById('app');
    if (!rootEl) { console.error('[LDB] #app não encontrado'); return; }

    const loaded = G.save.read();
    G.game.init(loaded);
    M.applySettings();

    // áudio só pode iniciar após um gesto do usuário
    const unlock = function () {
      if (G.audio.init()) {
        G.audio.setVolume('music', G.game.settings.music);
        G.audio.setVolume('sfx', G.game.settings.sfx);
        G.audio.setVolume('ui', G.game.settings.ui);
        G.audio.setMuted(!!G.game.settings.muted);
        playRegionMusic();
      }
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    G.ui.build(rootEl);
    G.ui.showMenu(function (isNew) {
      if (isNew) {
        G.save.wipe();
        G.game.init(null);
        startedFresh = true;
      }
      G.ui.show('battle');
      G.game.startBattle(G.game.state.stage);
      // recompensas offline
      if (!isNew && loaded && loaded.__savedAt) {
        const res = G.idle.computeOffline(Date.now() - loaded.__savedAt);
        if (res) setTimeout(() => G.ui.showOffline(res), 500);
      }
      // recompensa diária
      if (G.game.canClaimDaily()) setTimeout(() => G.ui.showDaily(), res_delay());
      start();
    });

    bindKeys();
    bindWindow();
    checkScreenSize();

    // Armazenamento bloqueado (aba anônima estrita): avisa de forma visível,
    // porque nesse caso o jogador perde tudo ao fechar sem saber.
    if (!G.save.available) {
      setTimeout(function () { G.ui.toast(G.t('storageWarning'), 'warn'); }, 1800);
    }
  };
  function res_delay() { return 1200; }

  function playRegionMusic() {
    const s = G.game.state;
    if (!s) return;
    const stage = G.getStage(s.stage);
    const region = G.regionById[stage.region];
    if (region) G.audio.playMusic(region.music);
  }
  M.playRegionMusic = playRegionMusic;
  let lastMusicRegion = null;

  /* ---------------- laço ----------------
   * O tempo vem do relógio de parede, não do requestAnimationFrame.
   * Navegadores congelam o rAF em abas ocultas ou janelas minimizadas, então
   * um laço guiado por quadros simplesmente pararia o jogo — inaceitável num
   * idle. Aqui o tempo decorrido vira uma dívida de simulação que é paga em
   * passos fixos assim que a aba volta, e ausências longas caem no cálculo de
   * recompensa offline.
   * -------------------------------------------------------------------- */
  const MAX_STEP = 0.1;             // passo fixo de simulação (s)
  const MAX_STEPS_PER_FRAME = 600;  // teto de ~60 s de jogo por quadro
  const LONG_ABSENCE = 180;         // acima disso, vira recompensa offline
  let acc = 0;                      // segundos de simulação devidos
  let lastWall = Date.now();

  let heartbeat = null;

  function start() {
    if (running) return;
    running = true;
    lastWall = Date.now();
    acc = 0;
    requestAnimationFrame(frame);
    // Batimento independente do rAF. Em aba oculta o navegador limita este
    // intervalo (tipicamente a 1x por segundo, ou menos), mas mesmo assim o
    // jogo continua andando de verdade em vez de congelar até a volta.
    if (!heartbeat) heartbeat = setInterval(function () { tick(false); }, 1000);
  }

  /** Quadro visível: simula e desenha. */
  function frame() {
    if (!running) return;
    requestAnimationFrame(frame);
    tick(true);
  }

  /**
   * Avança o jogo pelo tempo real decorrido. Chamado tanto pelo rAF quanto
   * pelo batimento; como tudo vem do relógio de parede, chamar duas vezes no
   * mesmo instante não conta o tempo em dobro.
   */
  function tick(canRender) {
    const wall = Date.now();
    let elapsed = (wall - lastWall) / 1000;
    lastWall = wall;
    if (elapsed < 0) elapsed = 0;      // relógio do sistema mexeu para trás

    // Pausa explícita (Esc) não acumula tempo: é escolha do jogador.
    if (paused) { acc = 0; return; }

    if (elapsed > LONG_ABSENCE) { longAbsence(elapsed); return; }

    acc += elapsed;
    const catchingUp = acc > 2;
    let steps = 0;
    while (acc > 0.0005 && steps < MAX_STEPS_PER_FRAME) {
      const dt = Math.min(acc, MAX_STEP);
      G.game.update(dt);
      acc -= dt;
      steps++;
    }
    // Numa recuperação longa, descarta os efeitos acumulados: senão o jogador
    // voltaria para uma avalanche de números de dano de coisas que já passaram.
    if (catchingUp && G.game.battle) G.game.battle.fx.length = 0;

    // Desenhar só faz sentido no quadro visível e na tela de batalha; o
    // batimento apenas simula. Fora disso, descarta os efeitos pendentes.
    if (canRender && !hidden && G.ui.current === 'battle') {
      G.render.consume(G.game.battle);
      G.render.draw(G.game.battle, Math.min(elapsed, 0.05));
      G.ui.updateHud();
    } else if (G.game.battle) {
      G.game.battle.fx.length = 0;
    }
    // troca de trilha ao mudar de região
    const stage = G.getStage(G.game.state.stage);
    if (stage.region !== lastMusicRegion) { lastMusicRegion = stage.region; if (!hidden) playRegionMusic(); }
    // salvamento periódico
    saveTimer += elapsed;
    if (saveTimer > 20 && G.game.settings.autoSave) { saveTimer = 0; G.game.saveNow(); }
  }

  /** Ausência longa: credita como progresso offline, sem simular tudo. */
  function longAbsence(seconds) {
    acc = 0;
    const res = G.idle.computeOffline(seconds * 1000);
    if (res) G.ui.showOffline(res);
    G.game.saveNow();
  }

  M.togglePause = function () {
    paused = !paused;
    G.audio.play('click');
    const b = document.querySelector('.bt-ctrl .sbtn[title="Esc"]');
    if (b) b.textContent = paused ? '▶' : '⏸';
    if (paused) G.audio.stopMusic(); else playRegionMusic();
  };
  M.isPaused = function () { return paused; };

  /* ---------------- teclado ---------------- */
  function bindKeys() {
    window.addEventListener('keydown', function (e) {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      const b = G.game.battle;
      switch (e.key) {
        case ' ': {
          e.preventDefault();
          if (!b) break;
          const u = b.party.find((x) => x.alive && x.energy >= 100 && x.ultimate && x.ultimate.cd <= 0);
          if (u) G.combat.castUltimate(b, u); else G.audio.play('error');
          break;
        }
        case '1': case '2': case '3': case '4': {
          if (!b) break;
          const u = b.party[+e.key - 1];
          if (u) { if (!G.combat.castUltimate(b, u)) G.audio.play('error'); }
          break;
        }
        case 'Escape': M.togglePause(); break;
        case 'm': case 'M': {
          const mm = !G.audio.isMuted();
          G.audio.setMuted(mm); G.game.settings.muted = mm; G.save.saveSettings(G.game.settings);
          const btn = document.getElementById('btn-mute'); if (btn) btn.textContent = mm ? '🔇' : '🔊';
          break;
        }
        case 'f': case 'F': M.toggleFullscreen(); break;
        case 'Tab': e.preventDefault(); G.ui.show('heroes'); break;
        case 'i': case 'I': G.ui.show('bag'); break;
        case 'q': case 'Q': G.ui.show('quests'); break;
        case 'b': case 'B': G.ui.show('bestiary'); break;
        case 'c': case 'C': G.ui.show('craft'); break;
        default: break;
      }
    });
  }

  /* ---------------- janela ---------------- */
  function bindWindow() {
    window.addEventListener('resize', function () {
      G.render.resize();
      checkScreenSize();
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(() => { G.render.resize(); checkScreenSize(); }, 300);
    });
    document.addEventListener('visibilitychange', function () {
      hidden = document.hidden;
      if (hidden) {
        // O jogo NÃO para: o tempo continua contando pelo relógio de parede e
        // é recuperado no primeiro quadro após a volta. Só o som descansa.
        G.game.saveNow();
        G.audio.stopMusic();
      } else {
        playRegionMusic();
      }
    });
    // Três redes de segurança, porque nenhuma sozinha cobre todos os casos:
    //  - beforeunload: desktop, ao fechar a aba ou navegar para fora
    //  - pagehide: o único confiável no iOS/Safari e no bfcache do celular
    //  - freeze: quando o navegador congela a aba para poupar bateria
    window.addEventListener('beforeunload', function () { G.game.saveNow(); });
    window.addEventListener('pagehide', function () { G.game.saveNow(); });
    document.addEventListener('freeze', function () { G.game.saveNow(); });
    // impede rolagem indesejada durante o jogo
    document.body.addEventListener('touchmove', function (e) {
      if (e.target.closest && e.target.closest('.scrollable, .screen, .modal-body')) return;
      e.preventDefault();
    }, { passive: false });
  }

  M.toggleFullscreen = function () {
    const d = document.documentElement;
    if (!document.fullscreenElement) {
      (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    }
  };

  M.applySettings = function () {
    const st = G.game.settings;
    document.documentElement.style.fontSize = (16 * (st.textScale || 1)) + 'px';
    document.body.classList.toggle('high-contrast', !!st.highContrast);
    document.body.classList.toggle('reduced-motion', !!st.reducedMotion);
    if (G.render && G.render.resize) G.render.resize();
  };

  /* ---------------- dica de tela (opcional e dispensável) ----------------
   * O jogo é totalmente jogável em retrato e em telas pequenas. Isto é só
   * uma sugestão: aparece uma vez, não bloqueia nada e pode ser fechada
   * para sempre.
   * -------------------------------------------------------------------- */
  let hintTimer = null, hintShown = false;

  function dismissHint(permanent) {
    const pop = document.getElementById('hint-pop');
    if (pop) { pop.classList.remove('on'); setTimeout(function () { pop.remove(); }, 300); }
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
    if (permanent) {
      G.game.settings.hintDismissed = true;
      G.save.saveSettings(G.game.settings);
    }
  }
  M.dismissHint = dismissHint;
  M.showHint = showHint;

  function showHint(text, force) {
    if ((hintShown && !force) || G.game.settings.hintDismissed) return;
    if (document.getElementById('hint-pop')) return;
    hintShown = true;
    const pop = document.createElement('div');
    pop.id = 'hint-pop';
    const ic = document.createElement('span');
    ic.className = 'hp-ic'; ic.textContent = '📱';
    const tx = document.createElement('span');
    tx.className = 'hp-text'; tx.textContent = text;
    const close = document.createElement('button');
    close.className = 'hp-close'; close.textContent = '✕';
    close.title = G.t('close');
    close.setAttribute('aria-label', G.t('close'));
    close.addEventListener('click', function () { G.audio.play('back'); dismissHint(true); });
    pop.appendChild(ic); pop.appendChild(tx); pop.appendChild(close);
    document.body.appendChild(pop);
    requestAnimationFrame(function () { pop.classList.add('on'); });
    hintTimer = setTimeout(function () { dismissHint(false); }, 9000);
  }

  function checkScreenSize() {
    // Nada aqui bloqueia o jogo — só sugere, uma única vez por sessão.
    const tiny = window.innerWidth < 380 || window.innerHeight < 320;
    const portrait = window.innerHeight > window.innerWidth && window.innerWidth < 760;
    if (tiny) showHint(G.t('screenTooSmall'));
    else if (portrait) showHint(G.t('landscapeHint'));
  }

  /* ---------------- start ---------------- */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', M.boot);
  else M.boot();
})();


</script>
